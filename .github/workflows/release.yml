name: Release

on:
  push:
    branches: [main]
    paths: ['.changeset/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # ci:release builds the macOS addon, so the publish runs on this machine.
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      # No cache: a release job must not restore a cache an untrusted run wrote.
      - uses: ./.github/actions/setup
        with: { registry-url: 'https://registry.npmjs.org' }

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin
          cache: false
          rustflags: ''
      - run: xcodebuild -downloadComponent MetalToolchain

      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run ci:version
          publish-script: bun run ci:release
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
