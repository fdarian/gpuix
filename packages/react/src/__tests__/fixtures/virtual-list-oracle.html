<!doctype html>
<!--
  Oracle for the rows of a <virtual-list> (round 15c, 15a leftovers: virtual-list rows on the device pixel, a virtual
  list's getBoundingClientRect): a scroller of divs whose heights are fractions of a pixel, in Chrome. A <virtual-list>
  is the same page with its rows built on demand, so the page is a list of scenes (`spec`) the test renders as both.

  A scene is a positioned parent (optional), the scroller and its rows (`style` is a CSS declaration list; a row with
  `text` holds it as its text), and the scroll offsets the scroller is set to one after the other. The scroller is
  `overflow: auto` with `scrollbar-width: none`, so a row is as wide as the scroller inside its padding.

  The JSON is `{ <scene>: { spec, list, scrollHeight, clientWidth, clientHeight, border, steps: [{ scroll, scrollTop,
  rows }] } }` (`border` is the computed width of each side, top first) with every box `[x, y, width, height]` relative to the holder (at 0, 0): the scroller's
  getBoundingClientRect, and for each offset the offset it was set to, the one Chrome scrolled to (a device pixel) and
  the box of every row. A row can show only in the top padding of a scrolled list (`a row in the top padding` scenes).

  A scene with a `radius` list (the `rounded` scenes) also records `probes` at every step: points near each corner of
  the padding box, on the diagonal of its corner ellipse (the border radius less the border width, per axis), at 0.85
  and 1.1 times the ellipse. `hit` is what `document.elementFromPoint` returns there: a row's index, `list` (the border)
  or `outside` (nothing of the list). Chrome clips the rows, painted and hit, by the rounded padding box, so a row is
  hit at 0.85 and not at 1.1.
  Regenerate with

    sh dsf-oracle.sh virtual-list

  (device scale 1 into virtual-list-oracle.json and 2 into virtual-list-oracle-x2.json, as Blink zooms the page by the
  display's scale).
-->
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; }
  .holder { position: absolute; left: 0; top: 0; width: 600px; height: 400px; }
</style>
</head>
<body>
<script>
  const FONT = 'font-family:Helvetica;font-size:13px;line-height:1.15'
  const fixed = (count, height) => Array.from({ length: count }, () => ({ style: `height:${height}px` }))
  const text = (count) => Array.from({ length: count }, (_, index) => ({ style: FONT, text: `Row ${index}` }))
  const mixed = (count) => Array.from({ length: count }, (_, index) => {
    const kind = index % 4
    if (kind === 0) return { style: 'height:20.3px' }
    if (kind === 1) return { style: FONT, text: `Row ${index}` }
    if (kind === 2) return { style: 'height:33.33px' }
    return { style: 'height:7.77px' }
  })
  const LIST = 'width:200px;height:100px;overflow:auto;scrollbar-width:none'

  const scenes = {
    'rows of 20.3px': { list: LIST, rows: fixed(12, 20.3), scrolls: [0, 10.3, 10.5, 33.7, 81.2, 1000] },
    'rows of 13px text at 1.15': { list: LIST, rows: text(20), scrolls: [0, 7.4, 29.5, 118.2, 1000] },
    'rows of mixed fractions': { list: LIST, rows: mixed(16), scrolls: [0, 40.5, 77.7, 1000] },
    'a list of 100.3px': { list: 'width:200px;height:100.3px;overflow:auto;scrollbar-width:none', rows: fixed(12, 20.3), scrolls: [0, 10.5, 1000] },
    'a list of 99.7px with rows of 14.95px': { list: 'width:200px;height:99.7px;overflow:auto;scrollbar-width:none', rows: text(20), scrolls: [0, 13.5, 1000] },
    'padded': { list: `${LIST};padding:3.3px 5.7px`, rows: fixed(12, 20.3), scrolls: [0, 10.5, 1000] },
    'padded with text rows': { list: `${LIST};padding:7.4px 1.3px 2.2px`, rows: text(20), scrolls: [0, 25.5, 1000] },
    'bordered and padded': { list: `${LIST};border:2px solid #000;padding:3.3px`, rows: fixed(12, 20.3), scrolls: [0, 10.5, 1000] },
    'bordered with text rows': { list: `${LIST};border:1px solid #000;padding:7.4px 1.3px 2.2px`, rows: text(20), scrolls: [0, 25.5, 1000] },
    'borders of each side': { list: `${LIST};border-style:solid;border-color:#000;border-width:1px 3px 2px 4px;padding:3.3px`, rows: fixed(12, 20.3), scrolls: [0, 10.5, 1000] },
    'a fractional border': { list: `${LIST};border:1.5px solid #000;padding:3.3px`, rows: fixed(12, 20.3), scrolls: [0, 10.5, 1000] },
    'a row in the top padding': { list: `${LIST};padding:30px 0 0`, rows: fixed(12, 20.3), scrolls: [0, 15, 45, 49.5, 50.5, 1000] },
    'a row in the top padding with a fractional padding': { list: `${LIST};padding:30.3px 0 2.6px`, rows: fixed(12, 20.3), scrolls: [45, 50.4, 1000] },
    'a row in the top padding of text rows': { list: `${LIST};padding:24.5px 0 0`, rows: text(20), scrolls: [20, 33.5, 1000] },
    'a bordered row in the top padding': { list: `${LIST};border:2px solid #000;padding:30px 0 0`, rows: fixed(12, 20.3), scrolls: [0, 45, 49.5, 1000] },
    'a row in the top padding below a border of each side': { list: `${LIST};border-style:solid;border-color:#000;border-width:3px 1px 2px 4px;padding:25px 2px 0 5px`, rows: fixed(12, 20.3), scrolls: [40, 1000] },
    'in a positioned parent': {
      parent: 'position:relative;left:10.3px;top:7.6px;width:300px;height:200px',
      list: 'position:absolute;left:5.7px;top:3.3px;width:200.5px;height:100.3px;overflow:auto;scrollbar-width:none',
      rows: fixed(12, 20.3),
      scrolls: [0, 10.5, 1000],
    },
    'in a positioned parent with text rows': {
      parent: 'position:relative;left:0.5px;top:0.5px;width:300px;height:200px',
      list: 'position:absolute;left:0.25px;top:0.75px;width:200px;height:100px;overflow:auto;scrollbar-width:none',
      rows: text(20),
      scrolls: [0, 7.5, 1000],
    },
    'bordered, padded, positioned': {
      parent: 'position:relative;left:10.3px;top:7.6px;width:300px;height:200px',
      list: 'position:absolute;left:5.7px;top:3.3px;width:200.5px;height:100.3px;overflow:auto;scrollbar-width:none;border:1px solid #000;padding:2.5px',
      rows: fixed(12, 20.3),
      scrolls: [0, 10.5, 1000],
    },
    'a few rows': { list: LIST, rows: fixed(3, 20.3), scrolls: [0, 1000] },
    'a rounded list': { list: `${LIST};border-radius:30px`, rows: fixed(12, 40), scrolls: [0, 25, 1000], rounded: true },
    'a rounded list with a border': { list: `${LIST};border:4px solid #000;border-radius:30px`, rows: fixed(12, 40), scrolls: [0, 25, 1000], rounded: true },
    'a rounded list with a border and padding': { list: `${LIST};border:3px solid #000;border-radius:24px;padding:5px 8px`, rows: fixed(12, 40), scrolls: [0, 25, 1000], rounded: true },
    'a list with elliptical percent radii': { list: `${LIST};border:3px solid #000;border-radius:20% / 50%`, rows: fixed(12, 40), scrolls: [0, 25, 1000], rounded: true },
    'a list with a radius for each corner': { list: `${LIST};border:2px solid #000;border-radius:40px 10px 30px 20px / 20px 30px 10px 40px`, rows: fixed(12, 40), scrolls: [0, 25, 1000], rounded: true },
  }

  /** The corner ellipses of the padding box and the points on their diagonals, in the holder's space. */
  const probesOf = (list, origin) => {
    const style = getComputedStyle(list)
    const rect = list.getBoundingClientRect()
    const border = { top: parseFloat(style.borderTopWidth), right: parseFloat(style.borderRightWidth), bottom: parseFloat(style.borderBottomWidth), left: parseFloat(style.borderLeftWidth) }
    const length = (token, of) => (token.endsWith('%') ? (parseFloat(token) / 100) * of : parseFloat(token))
    const corners = [
      ['TopLeft', 1, 1, border.left, border.top],
      ['TopRight', -1, 1, border.right, border.top],
      ['BottomRight', -1, -1, border.right, border.bottom],
      ['BottomLeft', 1, -1, border.left, border.bottom],
    ]
    const points = []
    for (const [corner, sx, sy, borderX, borderY] of corners) {
      const tokens = style[`border${corner}Radius`].split(' ')
      const rx = Math.max(0, length(tokens[0], rect.width) - borderX)
      const ry = Math.max(0, length(tokens[1] ?? tokens[0], rect.height) - borderY)
      const x = sx === 1 ? rect.left + borderX : rect.right - borderX
      const y = sy === 1 ? rect.top + borderY : rect.bottom - borderY
      const centre = [x + sx * rx, y + sy * ry]
      for (const k of [0.85, 1.1]) {
        points.push([centre[0] - sx * Math.SQRT1_2 * rx * k - origin.x, centre[1] - sy * Math.SQRT1_2 * ry * k - origin.y])
      }
    }
    return points
  }

  const box = (element, origin) => {
    const rect = element.getBoundingClientRect()
    return [rect.x - origin.x, rect.y - origin.y, rect.width, rect.height]
  }
  const out = {}
  for (const [name, scene] of Object.entries(scenes)) {
    const holder = document.createElement('div')
    holder.className = 'holder'
    const parent = scene.parent ? document.createElement('div') : holder
    if (scene.parent) {
      parent.setAttribute('style', scene.parent)
      holder.appendChild(parent)
    }
    const list = document.createElement('div')
    list.setAttribute('style', scene.list)
    for (const row of scene.rows) {
      const element = document.createElement('div')
      element.setAttribute('style', row.style)
      if (row.text) element.textContent = row.text
      list.appendChild(element)
    }
    parent.appendChild(list)
    document.body.appendChild(holder)
    const origin = holder.getBoundingClientRect()
    const steps = []
    for (const scroll of scene.scrolls) {
      list.scrollTop = scroll
      const step = { scroll, scrollTop: list.scrollTop, rows: [...list.children].map((row) => box(row, origin)) }
      if (scene.rounded) {
        step.probes = probesOf(list, origin).map(([x, y]) => {
          const hit = document.elementFromPoint(x + origin.x, y + origin.y)
          return { x, y, hit: hit === list ? 'list' : hit?.parentElement === list ? [...list.children].indexOf(hit) : 'outside' }
        })
      }
      steps.push(step)
    }
    out[name] = {
      spec: { parent: scene.parent ?? null, list: scene.list, rows: scene.rows, scrolls: scene.scrolls },
      list: box(list, origin),
      scrollHeight: list.scrollHeight,
      clientWidth: list.clientWidth,
      clientHeight: list.clientHeight,
      border: ['Top', 'Right', 'Bottom', 'Left'].map((side) => parseFloat(getComputedStyle(list)[`border${side}Width`])),
      steps,
    }
    document.body.removeChild(holder)
  }
  document.body.setAttribute('data-rects', JSON.stringify(out))
</script>
</body>
</html>
