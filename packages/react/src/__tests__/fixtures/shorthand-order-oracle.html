<!doctype html>
<!--
  Oracle for shorthand-order.test.tsx: within one style object, of a shorthand and a longhand it covers the one
  written LATER wins. Every case is a host style written key by key, in order, the way the test writes its
  style object, and the boxes headless Chrome lays out for it. Regenerate with

    CHROME=/Users/farreldarian/Library/Caches/ms-playwright/chromium_headless_shell-1248/chrome-headless-shell-mac-arm64/chrome-headless-shell
    $CHROME --headless --window-size=1280,800 --dump-dom file:///<this file> \
      | grep -o 'data-oracle="[^"]*"' | sed 's/^data-oracle="//; s/"$//; s/&quot;/"/g; s/&amp;/\&/g' \
      > shorthand-order-oracle.json

  `cases` hold the style objects the test renders, `rects` what Chrome reports (`[x, y, width, height]` of the
  two children and the host, relative to the scene). `universal` cases layer `* { ... }` rules over each other:
  a later layer's key beats an earlier layer's, shorthand or longhand, and `childInBox` is where the 20x10 child sits in
  its 60x40 box (the box's padding). The scene is 300x200; `box-sizing: border-box`, as gpuix has it.
-->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;font:16px/1 sans-serif}
.scene{position:relative;width:300px;height:200px;font-size:16px}
.host{display:flex;width:120px;height:90px}
.kid{width:20px;height:10px}
</style></head><body>
<div id="out"></div>
<script>
// [name, host style, first child style, second child style, host extra css]. Keys are in written order.
const grid = { display: 'grid', gridTemplateColumns: 'repeat(4, 30px)' };
const abs = { position: 'relative' };
const bordered = { borderStyle: 'solid' };
const cases = [
  ['padding then left', { padding: 8, paddingLeft: 4 }],
  ['left then padding', { paddingLeft: 4, padding: 8 }],
  ['padding then block', { padding: '8px 6px', paddingBlock: 2 }],
  ['block then padding', { paddingBlock: 2, padding: '8px 6px' }],
  ['top then block', { paddingTop: 1, paddingBlock: 3 }],
  ['block then top', { paddingBlock: 3, paddingTop: 1 }],
  ['top, padding, block', { paddingTop: 1, padding: 8, paddingBlock: 3 }],
  ['block, padding, top', { paddingBlock: 3, padding: 8, paddingTop: 1 }],
  ['inline then padding', { paddingInline: 3, padding: 8 }],
  ['padding then inline', { padding: 8, paddingInline: 3 }],
  ['margin then left', {}, { margin: 6, marginLeft: 2 }],
  ['left then margin', {}, { marginLeft: 2, margin: 6 }],
  ['margin then block', {}, { margin: 6, marginBlock: 1 }],
  ['block then margin', {}, { marginBlock: 1, margin: 6 }],
  ['gap then row', { flexWrap: 'wrap', alignContent: 'flex-start', width: 30, gap: 8, rowGap: 3 }],
  ['row then gap', { flexWrap: 'wrap', alignContent: 'flex-start', width: 30, rowGap: 3, gap: 8 }],
  ['gap then column', { gap: 8, columnGap: 3 }],
  ['column then gap', { columnGap: 3, gap: 8 }],
  ['flex then grow', {}, { flex: 1, flexGrow: 3 }, { flex: 1 }],
  ['grow then flex', {}, { flexGrow: 3, flex: 1 }, { flex: 1 }],
  ['flex then basis', {}, { flex: 1, flexBasis: 40 }, { flex: 1 }],
  ['basis then flex', {}, { flexBasis: 40, flex: 1 }, { flex: 1 }],
  ['flow then direction', { flexFlow: 'column', flexDirection: 'row' }],
  ['direction then flow', { flexDirection: 'row', flexFlow: 'column' }],
  ['place-items then align', { placeItems: 'center', alignItems: 'flex-start' }],
  ['align then place-items', { alignItems: 'flex-start', placeItems: 'center' }],
  ['place-content then justify', { placeContent: 'center', justifyContent: 'flex-end' }],
  ['justify then place-content', { justifyContent: 'flex-end', placeContent: 'center' }],
  ['inset then left', { position: 'relative' }, { position: 'absolute', inset: 10, left: 30 }, { position: 'absolute', inset: 10 }],
  ['left then inset', { position: 'relative' }, { position: 'absolute', left: 30, inset: 10 }, { position: 'absolute', inset: 10 }],
  ['inset-block then top', { position: 'relative' }, { position: 'absolute', insetBlock: 12, top: 5 }, { position: 'absolute', inset: 10 }],
  ['top then inset-block', { position: 'relative' }, { position: 'absolute', top: 5, insetBlock: 12 }, { position: 'absolute', inset: 10 }],
  ['inset, inset-inline, right', { position: 'relative' }, { position: 'absolute', top: 0, inset: 40, insetInline: 50, right: 70 }, { position: 'absolute', inset: 10 }],
  ['width then left', { ...bordered, borderWidth: 2, borderLeftWidth: 6 }],
  ['left width then width', { ...bordered, borderLeftWidth: 6, borderWidth: 2 }],
  ['all then top shorthand', { ...bordered, borderWidth: 2, borderTop: '5px solid red' }],
  ['top shorthand then all', { ...bordered, borderTop: '5px solid red', borderWidth: 2 }],
  ['all, top, right shorthands', { ...bordered, borderWidth: 2, borderTop: '5px solid red', borderRight: '7px solid red' }],
  ['all, top shorthand, later all', { ...bordered, borderWidth: 2, borderTop: '5px solid red', borderBottomWidth: 9 }],
  ['border then left style', { border: '3px solid red', borderLeftStyle: 'none' }],
  ['left style then border', { borderLeftStyle: 'none', border: '3px solid red' }],
  ['border then style', { border: '3px solid red', borderStyle: 'none' }],
  ['style then border', { borderStyle: 'none', border: '3px solid red' }],
  ['border-block then top', { borderBlock: '4px solid red', borderTop: '1px solid red' }],
  ['top then border-block', { borderTop: '1px solid red', borderBlock: '4px solid red' }],
  ['width then border-block', { ...bordered, borderWidth: 2, borderBlock: '6px solid red' }],
  ['border-block then width', { ...bordered, borderBlock: '6px solid red', borderWidth: 2 }],
  ['border-inline then left width', { borderInline: '4px solid red', borderLeftWidth: 1 }],
  ['left width then border-inline', { borderLeftWidth: 1, borderInline: '4px solid red' }],
  ['border then width', { border: '3px solid red', borderWidth: 1 }],
  ['width then border', { borderWidth: 1, border: '3px solid red' }],
  ['invalid border after top width', { ...bordered, borderTopWidth: 5, border: 'garbage' }],
  ['invalid border-block after top width', { ...bordered, borderTopWidth: 5, borderBlock: '1px 2px' }],
  ['invalid border-color after top width', { ...bordered, borderTopWidth: 5, borderColor: 'red bogus' }],
  ['invalid border-style after top style', { borderWidth: 4, borderTopStyle: 'solid', borderStyle: 'wavy' }],
  ['grid-column then start', { ...grid }, { gridColumn: '1 / 3', gridColumnStart: 2 }, { gridColumn: '4 / 5' }],
  ['start then grid-column', { ...grid }, { gridColumnStart: 2, gridColumn: '1 / 3' }, { gridColumn: '4 / 5' }],
  ['area then column', { ...grid }, { gridArea: '1 / 1 / 2 / 2', gridColumn: '2 / 4' }, { gridColumn: '4 / 5' }],
  ['column then area', { ...grid }, { gridColumn: '2 / 4', gridArea: '1 / 1 / 2 / 2' }, { gridColumn: '4 / 5' }],
];
// Layers of `* { ... }` rules over a box that holds a child: [name, layers]. The child's offset in the box is
// the padding, and the box's size follows its margin.
const universal = [
  ['padding over left', [{ paddingLeft: 4 }, { padding: 8 }]],
  ['left over padding', [{ padding: 8 }, { paddingLeft: 4 }]],
  ['padding, left, padding', [{ padding: 8 }, { paddingLeft: 4 }, { padding: 6 }]],
  ['left, padding, left', [{ paddingLeft: 4 }, { padding: 8 }, { paddingLeft: 2 }]],
  ['two properties of a layer', [{ paddingLeft: 4, paddingTop: 1 }, { padding: 8, paddingLeft: 3 }]],
];

const kebab = (key) => key.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase());
const UNITLESS = ['flex', 'flexGrow', 'flexShrink', 'gridColumnStart', 'gridColumnEnd', 'gridRowStart', 'gridRowEnd', 'order'];
const length = (key, value) => typeof value === 'number' && !UNITLESS.includes(key) ? value + 'px' : String(value);
const css = (key, value) => [kebab(key), length(key, value)];
function apply(el, style) {
  for (const key of Object.keys(style)) el.style.setProperty(...css(key, style[key]));
}
const rectOf = (el, scene) => {
  const box = el.getBoundingClientRect(), origin = scene.getBoundingClientRect();
  return [box.x - origin.x, box.y - origin.y, box.width, box.height];
};
const out = { cases: {}, universal: {} };
const stage = document.getElementById('out');
cases.forEach(([name, host = {}, child = {}, child2 = {}], index) => {
  const scene = document.createElement('div');
  scene.className = 'scene';
  scene.innerHTML = '<div class="host"><div class="kid"></div><div class="kid"></div></div>';
  stage.appendChild(scene);
  const hostEl = scene.firstChild, [first, second] = hostEl.children;
  apply(hostEl, host); apply(first, child); apply(second, child2);
  out.cases[name] = { host, child, child2, rects: { child: rectOf(first, scene), child2: rectOf(second, scene), host: rectOf(hostEl, scene) } };
  scene.remove();
});
universal.forEach(([name, layers], index) => {
  const scene = document.createElement('div');
  scene.className = 'scene';
  scene.id = 'u' + index;
  scene.innerHTML = '<div class="host"></div>';
  stage.appendChild(scene);
  const box = document.createElement('div');
  box.innerHTML = '<div class="kid"></div>';
  scene.firstChild.appendChild(box);
  box.style.width = '60px'; box.style.height = '40px';
  const layersCss = layers.map((layer) => '#u' + index + ' * {' + Object.keys(layer).map((key) => kebab(key) + ':' + length(key, layer[key])).join(';') + '}').join('\n');
  const sheet = document.createElement('style');
  sheet.textContent = layersCss;
  document.head.appendChild(sheet);
  const inBox = rectOf(box.firstChild, box.parentNode);
  const boxRect = rectOf(box, box.parentNode);
  out.universal[name] = { layers, childInBox: [inBox[0] - boxRect[0], inBox[1] - boxRect[1]] };
  sheet.remove(); scene.remove();
});
document.body.setAttribute('data-oracle', JSON.stringify(out));
</script>
</body></html>
