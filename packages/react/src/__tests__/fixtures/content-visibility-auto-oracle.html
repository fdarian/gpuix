<!doctype html>
<!--
  Oracle for content-visibility-auto.test.tsx: which elements headless Chrome skips for `content-visibility: auto`, in what
  order it tells them, and the size it gives the box it skips, in the scenes the test builds. `content-visibility-auto-oracle.ts`
  drives the page over the DevTools protocol (a 900x780 viewport, no device scale) and writes `content-visibility-auto-oracle.json`:
  {scene: [{step, skipped: [index...], height, events: [[index, skipped]...], ...}]}. A scene is built after the page has
  settled, since the first frame of a page is not a frame like the others: Chrome tells every `auto` element it is skipped
  there, and then that it is not. The scene `load` (the page with `#load`, see the end of this file) is that first frame: its
  elements are in the markup, and what it records is the order of the events and of the animation frame callbacks.

  Every box is made of fixed sizes, so no font is involved. An entry is 37px: 8px padding, a 16px bar, a 4px gap, a 1px rule
  and 8px padding.
-->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0 }
* { box-sizing: border-box }
.page { width: 900px; height: 780px; display: flex; flex-direction: column; overflow: hidden }
.scroller { overflow-y: scroll; flex-grow: 1; display: flex; flex-direction: column; overflow-anchor: none }
.entry { display: flex; flex-direction: column; padding: 8px; gap: 4px; flex-shrink: 0 }
.bar { height: 16px }
.rule { height: 1px }
</style></head><body>
<script>
const frames = async (count = 4) => {
  for (let index = 0; index < count; index++) await new Promise((resolve) => requestAnimationFrame(resolve))
  await new Promise((resolve) => setTimeout(resolve, 60))
}

const made = (tag, className, style = {}) => {
  const element = document.createElement(tag)
  if (className) element.className = className
  Object.assign(element.style, style)
  return element
}

const entry = (index, style, events) => {
  const element = made('div', 'entry', style)
  element.dataset.index = index
  element.tabIndex = -1
  element.append(made('div', 'bar'), made('div', 'rule'))
  element.addEventListener('contentvisibilityautostatechange', (event) => events.push([index, event.skipped]))
  return element
}

/** Which entries have their content skipped, by whether the bar can be seen by `checkVisibility`. */
const skippedOf = (entries) =>
  entries.flatMap((element, index) => (element.firstChild.checkVisibility({ contentVisibilityAuto: true }) ? [] : [index]))

const scenes = {
  // The r11 shape: a scroller of entries that are `auto` with an intrinsic size that is not the size they have.
  async list() {
    const events = []
    const page = made('div', 'page')
    const scroller = made('div', 'scroller')
    const entries = Array.from({ length: 190 }, (_, index) => entry(index, { contentVisibility: 'auto', containIntrinsicSize: 'auto 40px' }, events))
    scroller.append(...entries)
    page.append(scroller)
    const steps = []
    const step = async (name, action) => {
      events.length = 0
      await action()
      await frames()
      const read = { step: name, skipped: skippedOf(entries), height: scroller.scrollHeight, top: scroller.scrollTop, events: events.slice() }
      steps.push(read)
    }
    await step('mounted', async () => document.body.append(page))
    for (const top of [1000, 4000, 7000, 0]) await step(`scrolled to ${top}`, async () => (scroller.scrollTop = top))
    return steps
  },

  // The same entries where the intrinsic size is the size they have.
  async exact() {
    const events = []
    const page = made('div', 'page')
    const scroller = made('div', 'scroller')
    const entries = Array.from({ length: 190 }, (_, index) => entry(index, { contentVisibility: 'auto', containIntrinsicSize: 'auto 21px' }, events))
    scroller.append(...entries)
    page.append(scroller)
    const steps = []
    const step = async (name, action) => {
      events.length = 0
      await action()
      await frames()
      steps.push({ step: name, skipped: skippedOf(entries), height: scroller.scrollHeight, top: scroller.scrollTop, events: events.slice() })
    }
    await step('mounted', async () => document.body.append(page))
    for (const top of [1000, 4000, 7000, 0]) await step(`scrolled to ${top}`, async () => (scroller.scrollTop = top))
    return steps
  },
}


/** Runs `actions` one after the other, reading `read()` after each has settled; `events` is what was told since the last. */
const run = async (events, actions, read) => {
  const steps = []
  for (const [name, action] of actions) {
    events.length = 0
    await action()
    await frames()
    steps.push({ step: name, ...read(), events: events.slice() })
  }
  return steps
}

const listPage = (heightOfScroller, intrinsic, events, entryStyle = {}) => {
  const page = made('div', 'page')
  const scroller = made('div', 'scroller', heightOfScroller ? { height: heightOfScroller, flexGrow: 0 } : {})
  const entries = Array.from({ length: 190 }, (_, index) => entry(index, { contentVisibility: 'auto', containIntrinsicSize: intrinsic, ...entryStyle }, events))
  scroller.append(...entries)
  page.append(scroller)
  return { page, scroller, entries }
}

Object.assign(scenes, {
  // A scroller shorter than the viewport: what clips the entry cuts the margin short.
  async clipped() {
    const events = []
    const { page, scroller, entries } = listPage('400px', 'auto 21px', events)
    return run(
      events,
      [['mounted', async () => document.body.append(page)], ...[2000, 0].map((top) => [`scrolled to ${top}`, async () => (scroller.scrollTop = top)])],
      () => ({ skipped: skippedOf(entries), height: scroller.scrollHeight, top: scroller.scrollTop })
    )
  },

  // A read of the geometry of an element in a skipped entry lays the entry out, and leaves it skipped: the same list as `list`,
  // read at the bar of four entries, near and far, after each step. The reads come before the state is looked at.
  async forced() {
    const events = []
    const { page, scroller, entries } = listPage(0, 'auto 40px', events)
    const bars = [10, 100, 150, 189]
    return run(
      events,
      [['mounted', async () => document.body.append(page)], ...[4000, 0].map((top) => [`scrolled to ${top}`, async () => (scroller.scrollTop = top)])],
      () => {
        const rects = bars.map((index) => {
          const box = entries[index].firstChild.getBoundingClientRect()
          return [box.x, box.y, box.width, box.height]
        })
        return { rects, skipped: skippedOf(entries), height: scroller.scrollHeight, top: scroller.scrollTop }
      }
    )
  },

  // Two skipped elements, one in the other: the read at the bar lays out both.
  async forcedNested() {
    const events = []
    const page = made('div', 'page')
    const scroller = made('div', 'scroller')
    const outer = made('div', '', { flexShrink: 0, padding: '4px', contentVisibility: 'hidden', containIntrinsicSize: '60px' })
    const inner = made('div', '', { margin: '6px', contentVisibility: 'hidden', containIntrinsicSize: '50px' })
    const bar = made('div', 'bar', { margin: '3px' })
    inner.append(bar)
    outer.append(made('div', '', { height: '30px' }), inner)
    scroller.append(outer, made('div', '', { height: '20px', flexShrink: 0 }))
    page.append(scroller)
    return run(events, [['mounted', async () => document.body.append(page)]], () => ({
      rects: [bar, inner, outer].map((element) => {
        const box = element.getBoundingClientRect()
        return [box.x, box.y, box.width, box.height]
      }),
      height: scroller.scrollHeight,
      top: scroller.scrollTop,
    }))
  },

  // A scroller inside skipped content: reading its scroll size lays the skipped element out, as reading a box does. One in a
  // `hidden` element and one in an `auto` element far below, read before and after the page is scrolled.
  async forcedScroller() {
    const events = []
    const page = made('div', 'page')
    const scroller = made('div', 'scroller')
    const scrolling = () => {
      const element = made('div', '', { height: '50px', width: '40px', overflowY: 'scroll', flexShrink: 0 })
      element.append(made('div', '', { height: '200px', width: '40px', flexShrink: 0 }))
      return element
    }
    const held = made('div', '', { flexShrink: 0, contentVisibility: 'hidden', containIntrinsicSize: '30px' })
    const heldScroller = scrolling()
    held.append(heldScroller)
    const far = made('div', '', { flexShrink: 0, contentVisibility: 'auto', containIntrinsicSize: 'auto 30px' })
    const farScroller = scrolling()
    far.append(farScroller)
    scroller.append(held, made('div', '', { height: '6000px', flexShrink: 0 }), far)
    page.append(scroller)
    return run(
      events,
      [['mounted', async () => document.body.append(page)], ['scrolled', async () => (scroller.scrollTop = 2000)]],
      () => ({
        metrics: [heldScroller, farScroller].map((element) => [element.scrollLeft, element.scrollTop, element.scrollWidth, element.scrollHeight, element.clientWidth, element.clientHeight]),
        height: scroller.scrollHeight,
        top: scroller.scrollTop,
      })
    )
  },

  // A row of items scrolled along the x axis: the margin is a viewport width and a half there.
  async horizontal() {
    const events = []
    const page = made('div', 'page')
    const scroller = made('div', 'scroller', { flexDirection: 'row', overflowX: 'scroll', overflowY: 'hidden', flexGrow: 0, height: '100px' })
    const entries = Array.from({ length: 120 }, (_, index) => {
      const item = made('div', '', { width: '100px', height: '100px', flex: 'none', contentVisibility: 'auto', containIntrinsicSize: 'auto 100px 100px' })
      item.append(made('div', 'bar'))
      item.addEventListener('contentvisibilityautostatechange', (event) => events.push([index, event.skipped]))
      return item
    })
    scroller.append(...entries)
    page.append(scroller)
    return run(
      events,
      [['mounted', async () => document.body.append(page)], ...[5000, 0].map((left) => [`scrolled to ${left}`, async () => (scroller.scrollLeft = left)])],
      () => ({ skipped: skippedOf(entries), height: scroller.scrollWidth, top: scroller.scrollLeft })
    )
  },

  // `auto` inside `auto`: 24 sections of 20 rows each. A row is clipped by its section, so it is near only where the section
  // is on screen.
  async nested() {
    const events = []
    const page = made('div', 'page')
    const scroller = made('div', 'scroller')
    const outers = Array.from({ length: 24 }, (_, o) => {
      const outer = made('div', '', { flexShrink: 0, contentVisibility: 'auto', containIntrinsicSize: 'auto 800px' })
      outer.addEventListener('contentvisibilityautostatechange', (event) => events.push([o, event.skipped]))
      for (let i = 0; i < 20; i++) {
        const inner = made('div', '', { height: '40px', contentVisibility: 'auto', containIntrinsicSize: 'auto 40px' })
        inner.append(made('div', 'bar'))
        outer.append(inner)
      }
      return outer
    })
    scroller.append(...outers)
    page.append(scroller)
    const read = () => ({
      skipped: skippedOf(outers),
      rows: outers.map((outer) => (outer.firstChild.checkVisibility({ contentVisibilityAuto: true }) ? [...outer.children].filter((inner) => inner.firstChild.checkVisibility({ contentVisibilityAuto: true })).length : 0)),
      height: scroller.scrollHeight,
      top: scroller.scrollTop,
    })
    return run(
      events,
      [['mounted', async () => document.body.append(page)], ...[6000, 12000, 0].map((top) => [`scrolled to ${top}`, async () => (scroller.scrollTop = top)])],
      read
    )
  },

  // The focus inside an entry that is far away keeps it.
  async focus() {
    const events = []
    const { page, scroller, entries } = listPage(null, 'auto 21px', events)
    for (const element of entries) element.firstChild.tabIndex = -1
    return run(
      events,
      [
        ['mounted', async () => document.body.append(page)],
        ['focused 180', async () => entries[180].firstChild.focus({ preventScroll: true })],
        ['scrolled to 4000', async () => (scroller.scrollTop = 4000)],
        ['scrolled to 0', async () => (scroller.scrollTop = 0)],
        ['blurred', async () => document.activeElement.blur()],
      ],
      () => ({ skipped: skippedOf(entries), height: scroller.scrollHeight, top: scroller.scrollTop, focused: entries.findIndex((element) => element.contains(document.activeElement)) })
    )
  },

  // No `contain-intrinsic-size` at all: `auto` is in effect for an element that is skipped, so it keeps the size it had.
  async bare() {
    const events = []
    const { page, scroller, entries } = listPage(null, 'none', events)
    return run(
      events,
      [['mounted', async () => document.body.append(page)], ...[3000, 0].map((top) => [`scrolled to ${top}`, async () => (scroller.scrollTop = top)])],
      () => ({ skipped: skippedOf(entries), height: scroller.scrollHeight, top: scroller.scrollTop })
    )
  },

  // The size `auto` in `contain-intrinsic-size` stands for.
  async remember() {
    const events = []
    const page = made('div', 'page')
    const scroller = made('div', 'scroller')
    const make = (value) => {
      const target = made('div', '', { flexShrink: 0, contentVisibility: value, containIntrinsicSize: 'auto 60px', width: '200px' })
      const child = made('div', '', { height: '100px', width: '50px', flexShrink: 0 })
      target.append(child)
      return { target, child }
    }
    const shown = make('visible')
    const far = make('auto')
    const never = make('hidden')
    const spacer = made('div', '', { height: '3000px', flexShrink: 0 })
    scroller.append(shown.target, never.target, spacer, far.target)
    page.append(scroller)
    far.target.addEventListener('contentvisibilityautostatechange', (event) => events.push([0, event.skipped]))
    const read = () => ({
      sizes: [shown.target, never.target, far.target].map((target) => target.getBoundingClientRect().height),
      top: scroller.scrollTop,
      height: scroller.scrollHeight,
    })
    return run(
      events,
      [
        ['mounted', async () => document.body.append(page)],
        ['hidden', async () => (shown.target.style.contentVisibility = 'hidden')],
        ['child grew while hidden', async () => (shown.child.style.height = '200px')],
        ['visible', async () => (shown.target.style.contentVisibility = 'visible')],
        ['hidden again', async () => (shown.target.style.contentVisibility = 'hidden')],
        ['scrolled to 3000', async () => (scroller.scrollTop = 3000)],
        ['scrolled to 0', async () => (scroller.scrollTop = 0)],
      ],
      read
    )
  },
})

// The first read after a change (`firstRead...`): each step changes the page and then reads the boxes of `names[step]`, by
// `data-id`, the first of which is inside content that is skipped. gpuix lays the page out once for that first read.
const named = (id, className, style) => {
  const element = made('div', className, style)
  element.dataset.id = id
  return element
}

const rectsOf = (page, names) =>
  names.map((name) => {
    const box = page.querySelector(`[data-id="${name}"]`).getBoundingClientRect()
    return [box.x, box.y, box.width, box.height]
  })

/** Runs `changes` (the first mounts the page) and reads `names[step]` after each. */
const firstRead = (page, scroller, names, changes) => {
  let step = 0
  return run(
    [],
    changes.map(([label, change], index) => [label, async () => { step = index; change() }]),
    () => ({ names: names[step], rects: rectsOf(page, names[step]), height: scroller.scrollHeight, top: scroller.scrollTop })
  )
}

const pageOf = () => {
  const page = made('div', 'page')
  const scroller = made('div', 'scroller')
  page.append(scroller)
  return { page, scroller }
}

const lead = () => made('div', '', { height: '20px', flexShrink: 0 })

Object.assign(scenes, {
  // A layout write inside a `hidden` element: the child grows, gets a margin, the element gets another intrinsic size and padding.
  async firstReadInside() {
    const { page, scroller } = pageOf()
    const held = named('held', '', { flexShrink: 0, contentVisibility: 'hidden', containIntrinsicSize: '30px', padding: '4px' })
    const child = named('child', '', { height: '70px', width: '40px', margin: '5px', flexShrink: 0 })
    const twin = named('twin', '', { height: '20px', width: '30px', flexShrink: 0 })
    held.append(child, twin)
    scroller.append(lead(), held, named('after', '', { height: '20px', flexShrink: 0 }))
    const names = ['child', 'twin', 'held', 'after']
    return firstRead(page, scroller, [names, names, names, names, names], [
      ['mounted', () => document.body.append(page)],
      ['child grows', () => (child.style.height = '90px')],
      ['child margin', () => (child.style.margin = '12px')],
      ['intrinsic size', () => (held.style.containIntrinsicSize = '50px')],
      ['padding', () => (held.style.padding = '10px')],
    ])
  },

  // A write that turns the ancestor of the element `hidden` or `visible` in the same turn as a layout write inside it.
  async firstReadTurns() {
    const { page, scroller } = pageOf()
    const held = named('held', '', { flexShrink: 0, contentVisibility: 'visible', containIntrinsicSize: '40px', padding: '4px' })
    const child = named('child', '', { height: '70px', width: '40px', margin: '5px', flexShrink: 0 })
    held.append(child)
    scroller.append(lead(), held, named('after', '', { height: '20px', flexShrink: 0 }))
    const names = ['child', 'held', 'after']
    return firstRead(page, scroller, [names, names, names, names, names], [
      ['mounted', () => document.body.append(page)],
      ['hidden', () => (held.style.contentVisibility = 'hidden')],
      ['visible', () => (held.style.contentVisibility = 'visible')],
      ['hidden and child grows', () => ((held.style.contentVisibility = 'hidden'), (child.style.height = '120px'))],
      ['visible and child grows', () => ((held.style.contentVisibility = 'visible'), (child.style.height = '150px'))],
    ])
  },

  // Nodes inserted into `hidden` content, and a `hidden` element inserted with the node a read is about inside it.
  async firstReadInserted() {
    const { page, scroller } = pageOf()
    const held = named('held', '', { flexShrink: 0, contentVisibility: 'hidden', containIntrinsicSize: '30px', padding: '4px' })
    const a = named('a', '', { height: '20px', width: '30px', flexShrink: 0 })
    held.append(a)
    const after = named('after', '', { height: '20px', flexShrink: 0 })
    scroller.append(lead(), held, after)
    const wrapper = named('wrapper', '', { flexShrink: 0, contentVisibility: 'hidden', containIntrinsicSize: '40px', padding: '2px' })
    const target = named('target', '', { height: '25px', width: '20px', flexShrink: 0 })
    wrapper.append(target)
    return firstRead(
      page,
      scroller,
      [['a', 'held', 'after'], ['ins', 'a', 'held', 'after'], ['target', 'wrapper', 'held', 'after'], ['deep', 'target', 'wrapper', 'after']],
      [
        ['mounted', () => document.body.append(page)],
        ['node inserted', () => held.prepend(named('ins', '', { height: '35px', width: '30px', margin: '3px', flexShrink: 0 }))],
        ['hidden element inserted', () => scroller.insertBefore(wrapper, after)],
        ['node inserted into it', () => wrapper.prepend(named('deep', '', { height: '12px', width: '10px', flexShrink: 0 }))],
      ]
    )
  },

  // Two `hidden` elements, one in the other, where only the inner one changes.
  async firstReadNested() {
    const { page, scroller } = pageOf()
    const outer = named('outer', '', { flexShrink: 0, padding: '4px', contentVisibility: 'hidden', containIntrinsicSize: '120px' })
    const inner = named('inner', '', { margin: '6px', contentVisibility: 'hidden', containIntrinsicSize: '50px' })
    const bar = named('bar', 'bar', { margin: '3px' })
    inner.append(bar)
    outer.append(made('div', '', { height: '30px' }), inner)
    scroller.append(lead(), outer, named('after', '', { height: '20px', flexShrink: 0 }))
    const names = ['bar', 'inner', 'outer', 'after']
    return firstRead(page, scroller, [names, names, names, names, names], [
      ['mounted', () => document.body.append(page)],
      ['inner intrinsic size', () => (inner.style.containIntrinsicSize = '80px')],
      ['inner visible', () => (inner.style.contentVisibility = 'visible')],
      ['inner hidden and bar grows', () => ((inner.style.contentVisibility = 'hidden'), (bar.style.height = '40px'))],
      ['inner margin', () => (inner.style.margin = '2px')],
    ])
  },

  // `auto` entries far from the viewport, skipped: a change of all of them, in a far one, and in a near one.
  async firstReadAuto() {
    const events = []
    const { page, scroller, entries } = listPage(0, 'auto 40px', events)
    entries.forEach((entry, index) => {
      entry.dataset.id = `entry-${index}`
      entry.firstChild.dataset.id = `bar-${index}`
    })
    const names = ['bar-150', 'bar-10', 'entry-189', 'entry-151']
    return firstRead(page, scroller, [names, names, names, names], [
      ['mounted', () => document.body.append(page)],
      ['intrinsic size', () => entries.forEach((entry) => (entry.style.containIntrinsicSize = 'auto 60px'))],
      ['bar of a far entry grows', () => (entries[150].firstChild.style.height = '30px')],
      ['bar of a near entry grows', () => (entries[10].firstChild.style.height = '40px')],
    ])
  },

  // The scroll size of a scroller in a `hidden` element after the content in it changes.
  async firstReadScroller() {
    const { page, scroller } = pageOf()
    const held = named('held', '', { flexShrink: 0, contentVisibility: 'hidden', containIntrinsicSize: '30px' })
    const scrolling = named('scrolling', '', { height: '50px', width: '40px', overflowY: 'scroll', flexShrink: 0 })
    const content = made('div', '', { height: '200px', width: '40px', flexShrink: 0 })
    scrolling.append(content)
    held.append(scrolling)
    scroller.append(held)
    return run(
      [],
      [
        ['mounted', async () => document.body.append(page)],
        ['content grows', async () => (content.style.height = '320px')],
        ['content shrinks', async () => (content.style.height = '30px')],
        ['scroller resized', async () => (scrolling.style.height = '80px')],
      ],
      () => ({ metrics: [[scrolling.scrollLeft, scrolling.scrollTop, scrolling.scrollWidth, scrolling.scrollHeight, scrolling.clientWidth, scrolling.clientHeight]], height: scroller.scrollHeight, top: scroller.scrollTop })
    )
  },
})

window.__run = async (name) => {
  await frames(6)
  return scenes[name]()
}
</script>
<script>
// The scene `load`: `auto` elements that are in the markup when the page loads (an entry on screen and one far below), and
// two that are added in the second animation frame callback (one on screen, one far). `log` is the order in which the events
// and the callbacks of the first frames happened.
if (location.hash === '#load') {
  const entryMarkup = (index) =>
    `<div class="entry" data-index="${index}" style="content-visibility: auto; contain-intrinsic-size: auto 40px"><div class="bar"></div><div class="rule"></div></div>`
  document.write(
    `<div class="page"><div class="scroller" id="scroller">${entryMarkup(0)}<div id="spacer" style="height: 3000px; flex-shrink: 0"></div>${entryMarkup(1)}</div></div>`
  )
  const log = []
  const events = []
  const listen = (element) =>
    element.addEventListener('contentvisibilityautostatechange', (event) => {
      const index = Number(element.dataset.index)
      log.push(`event ${index} ${event.skipped}`)
      events.push([index, event.skipped])
    })
  document.querySelectorAll('.entry').forEach(listen)
  const frame = () => new Promise((resolve) => requestAnimationFrame(resolve))
  window.__loaded = (async () => {
    for (let count = 1; count <= 5; count++) {
      await frame()
      log.push(`raf ${count}`)
      if (count === 2) {
        const scroller = document.getElementById('scroller')
        const near = made('div', '')
        near.innerHTML = entryMarkup(2)
        const far = made('div', '')
        far.innerHTML = entryMarkup(3)
        listen(near.firstChild)
        listen(far.firstChild)
        scroller.insertBefore(near.firstChild, document.getElementById('spacer'))
        scroller.append(far.firstChild)
      }
    }
    await new Promise((resolve) => setTimeout(resolve, 100))
    return { log, events }
  })()
}
</script>
</body></html>
