<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transform geometry oracle</title>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<script>
// What a CSS transform does to geometry, scene by scene. A scene is the markup of `#case` (an absolute 800x600 box at
// the window origin), measured in turn and removed. Results go to <body data-oracle> as {scene: {...}};
// transform-geometry-oracle.sh extracts them. For every element with an `id`:
//   boxes[id]  = getBoundingClientRect() as [x, y, width, height]
//   sizes[id]  = [offsetLeft, offsetTop, offsetWidth, offsetHeight, clientWidth, clientHeight, scrollWidth, scrollHeight],
//                none of which a transform changes
// and for a scene with `points`, `from["x,y"]` is the id of document.elementFromPoint(x, y), and for `clicks`,
// `offsets["x,y"]` is [id, offsetX, offsetY] of a click dispatched on that element at that point.
// `scroll` lists [id, scrollTop, scrollLeft] applied before measuring.
// `nest` is a scene of nested scrollers O > I > T: for every entry of `nest.ops` (a scrollIntoView option bag, or "focus"
// for T.focus()) the scrollers are put back to `nest.reset` ([id, scrollTop, scrollLeft]), T is aimed at, and
// `nested[i]` is [O.scrollTop, O.scrollLeft, I.scrollTop, I.scrollLeft] after it.

const abs = (id, l, t, w, h, css = "", inner = "") =>
  `<div id="${id}" style="position:absolute;left:${l}px;top:${t}px;width:${w}px;height:${h}px;${css}">${inner}</div>`;

const grid = (x0, y0, x1, y1, step, dx = 0, dy = 0) => {
  const out = [];
  for (let y = y0 + dy; y < y1; y += step) for (let x = x0 + dx; x < x1; x += step) out.push([x, y]);
  return out;
};

const SCROLLER = "overflow:auto;scrollbar-width:none;";

const scenes = {};

scenes["translate"] = {
  html:
    abs("a", 100.5, 50.25, 80, 40, "transform:translate(10.3px,-7.7px)") +
    abs("b", 20.75, 150.5, 33.3, 17.7, "translate:12.5px 3px") +
    abs("c", 200, 200, 60, 60, "transform:translateX(15px) translateY(-9px)") +
    abs("d", 300, 100, 50, 50, "transform:translate(-20px)") +
    abs("e", 400.4, 120.6, 40, 30, "transform:translate(0.5px, 0.25px)"),
};

scenes["rotate"] = {
  html:
    abs("r30", 100.5, 50.25, 80, 40, "transform:rotate(30deg)") +
    abs("r45", 250, 60, 100, 100, "transform:rotate(45deg)") +
    abs("r90", 400, 60, 80, 40, "transform:rotate(90deg)") +
    abs("rn17", 100, 200, 120.5, 60.25, "transform:rotate(-17deg)") +
    abs("r1rad", 300, 200, 70, 70, "transform:rotate(1rad)") +
    abs("rturn", 450, 200, 60, 30, "transform:rotate(0.1turn)") +
    abs("r180", 550, 60, 80, 50, "transform:rotate(180deg)") +
    abs("rgrad", 550, 200, 80, 50, "transform:rotate(100grad)"),
};

scenes["scale"] = {
  html:
    abs("s1", 100.5, 50.25, 80, 40, "transform:scale(1.5, 0.75)") +
    abs("s2", 250, 60, 60, 60, "transform:scale(-1, 1)") +
    abs("s3", 400, 60, 80, 40, "transform:scale(0.5)") +
    abs("s4", 100, 200, 33.33, 17.7, "transform:scale(2.37)") +
    abs("s5", 300, 200, 50, 50, "transform:scale(0)") +
    abs("s6", 450, 200, 50, 50, "transform:scaleX(2) scaleY(3)") +
    abs("s7", 580, 200, 50, 50, "scale:1.2 0.8"),
};

scenes["skew"] = {
  html:
    abs("k1", 100, 50, 80, 40, "transform:skew(20deg, 10deg)") +
    abs("k2", 250, 60, 80, 40, "transform:skewX(30deg)") +
    abs("k3", 400, 60, 80, 40, "transform:skewY(-25deg)") +
    abs("k4", 100.5, 200.25, 80, 40, "transform:skew(20deg)"),
};

scenes["matrix"] = {
  html:
    abs("m1", 100, 50, 80, 40, "transform:matrix(1.1, 0.3, -0.2, 0.9, 12, 8)") +
    abs("m2", 250, 60, 80, 40, "transform:matrix(0, 1, -1, 0, 0, 0)") +
    abs("m3", 400, 60, 80.5, 40.25, "transform:matrix(2, 0, 0, 2, 5.5, -3.25)") +
    abs("m4", 100, 200, 80, 40, "transform:matrix(1, 0, 0, 1, 0, 0)"),
};

{
  const origins = [
    "rotate(25deg);transform-origin:0 0",
    "rotate(25deg);transform-origin:100% 100%",
    "rotate(25deg);transform-origin:10px 20px",
    "rotate(25deg);transform-origin:25% 75%",
    "rotate(25deg);transform-origin:right bottom",
    "rotate(25deg);transform-origin:center top",
    "rotate(25deg);transform-origin:-20px 50%",
    "rotate(25deg);transform-origin:left",
    "scale(1.5);transform-origin:0 0",
    "scale(1.5);transform-origin:100% 50%",
    "skewX(20deg);transform-origin:0 100%",
    "rotate(25deg);transform-origin:50% 50%",
  ];
  scenes["origin"] = {
    html: origins.map((css, i) => abs(`o${i}`, 40 + (i % 4) * 190, 40 + Math.floor(i / 4) * 170, 80, 40, `transform:${css}`)).join(""),
  };
}

scenes["percent"] = {
  html:
    abs("p1", 100, 50, 80, 40, "transform:translate(50%, -25%)") +
    abs("p2", 250, 60, 120, 60, "transform:translateX(-100%)") +
    abs("p3", 400, 60, 33.3, 66.6, "transform:translate(10px, 20%)") +
    abs("p4", 100, 200, 90, 30, "translate:50% 50%") +
    abs("p5", 300, 200, 90, 30, "transform:translate(25%) rotate(10deg)"),
};

scenes["nested"] = {
  html:
    abs(
      "P", 100, 80, 200, 120, "transform:rotate(20deg)",
      abs("C", 30.5, 20.25, 100, 50, "transform:scale(1.2)",
        abs("G", 10, 8.5, 40, 20, "transform:translate(10px, 5px) rotate(15deg)")) +
        abs("Q", 120, 70, 50, 30)
    ) +
    abs("P2", 400, 80, 150, 100, "transform:scale(1.5)",
      abs("Q2", 10, 10, 60, 40, "", abs("R2", 5, 5, 30, 20, "transform:rotate(45deg)"))),
};

scenes["individual"] = {
  html:
    abs("i1", 100, 60, 80, 40, "translate:10px 20px;rotate:15deg;scale:1.2 0.8") +
    abs("i2", 250, 60, 80, 40, "translate:10px 20px;rotate:15deg;scale:1.2 0.8;transform:skewX(10deg)") +
    abs("i3", 400, 60, 80, 40, "rotate:30deg;transform-origin:0 0"),
};

scenes["scrolled"] = {
  html:
    abs(
      "S", 20, 30, 300, 150, SCROLLER,
      `<div id="sp" style="position:relative;width:700px;height:700px">` +
        abs("T", 100.5, 250.25, 80, 40, "transform:rotate(30deg)") +
        abs("U", 350, 120, 60, 60, "transform:scale(1.5)") +
        `</div>`
    ) +
    abs(
      "S2", 400, 30, 300, 150, SCROLLER + "transform:rotate(10deg)",
      `<div id="sp2" style="position:relative;width:500px;height:700px">` + abs("W", 100, 180, 80, 40, "transform:translate(10px, 10px)") + `</div>`
    ),
  scroll: [["S", 100, 50], ["S2", 40, 20]],
};

scenes["flow"] = {
  html:
    `<div id="f" style="position:absolute;left:10.5px;top:20.25px;width:500px;display:flex;gap:7.3px">` +
    `<div id="f1" style="width:100.3px;height:40.7px;transform:rotate(12deg)"></div>` +
    `<div id="f2" style="width:33.3%;height:30px;transform:scale(1.3)"></div>` +
    `<div id="f3" style="flex:1;height:50px;transform:translate(5px,5px)"></div>` +
    `</div>` +
    `<div id="b" style="position:absolute;left:30px;top:200px;width:300.5px">` +
    `<div id="b1" style="height:20.3px"></div>` +
    `<div id="b2" style="height:30.6px;margin-top:5.2px;transform:rotate(5deg)"></div>` +
    `<div id="b3" style="height:25px;transform:scale(0.9)"></div>` +
    `</div>`,
};

// Hit testing.
const HIT_GRID = grid(30, 30, 520, 330, 17, 0.37, 0.61);

scenes["hit-rotate"] = {
  html:
    abs("bg", 50, 50, 300, 200) +
    abs("r", 100, 100, 200, 60, "transform:rotate(45deg)") +
    abs("u", 320, 60, 40, 40) +
    abs("v", 400, 100, 80, 80, "transform:rotate(30deg)"),
  points: HIT_GRID,
};

scenes["hit-scale"] = {
  html:
    abs("q", 50, 50, 100, 80) +
    abs("p", 100, 100, 200, 100, "transform:scale(0.5)", abs("c", 20, 20, 60, 60)) +
    abs("e", 350, 60, 60, 60, "transform:scale(2)") +
    abs("f", 450, 60, 40, 40, "transform:scale(-1, 1);transform-origin:0 0"),
  points: HIT_GRID,
};

scenes["hit-translate"] = {
  html: abs("b", 50, 50, 100, 100) + abs("a", 50, 50, 100, 100, "transform:translate(120px, 40px)") + abs("c", 330, 60, 80, 80, "translate:-60px 30px"),
  points: HIT_GRID,
};

scenes["hit-skew"] = {
  html: abs("bg", 80, 80, 300, 180) + abs("k", 100, 100, 160, 80, "transform:skew(30deg, 10deg)"),
  points: HIT_GRID,
};

scenes["hit-clip"] = {
  html:
    abs(
      "P", 100, 80, 240, 140, "overflow:hidden;transform:rotate(25deg)",
      abs("C", 150, 60, 150, 100, "transform:rotate(-25deg)") + abs("D", 10, 10, 60, 40)
    ) + abs("Z", 330, 60, 60, 60),
  points: HIT_GRID,
};

scenes["hit-flat"] = {
  html: abs("bg", 50, 50, 300, 200) + abs("z", 100, 100, 100, 100, "transform:scale(0)") + abs("y", 250, 100, 60, 60, "transform:scaleX(0)"),
  points: grid(30, 30, 400, 280, 23, 0.37, 0.61),
};

scenes["hit-scroller"] = {
  html: abs(
    "S", 50, 50, 200, 150, SCROLLER + "transform:rotate(15deg)",
    `<div id="sp" style="position:relative;width:200px;height:500px">` + abs("T", 20, 180, 100, 50) + abs("U", 120, 300, 60, 60) + `</div>`
  ),
  scroll: [["S", 100, 0]],
  points: HIT_GRID,
};

// offsetX and offsetY.
const CLICKS = [
  [200, 150], [150, 120], [250, 170], [120, 110], [300, 130], [210, 200], [180, 90], [260, 120], [330, 160], [100, 100],
];

scenes["offset-rotate"] = {
  html: abs("t", 100, 100, 200, 100, "transform:rotate(30deg)") + abs("u", 400, 100, 100, 100, "border:4px solid red;transform:rotate(-20deg)"),
  clicks: [...CLICKS, [450, 150], [420, 120], [480, 180], [400, 100]],
};

scenes["offset-scale"] = {
  html: abs("t", 100, 100, 100, 50, "transform:scale(2)") + abs("u", 400, 100, 100, 100, "transform:scale(0.5, 1.5)", abs("w", 10, 10, 30, 30)),
  clicks: [[150, 125], [110, 100], [240, 140], [160, 90], [420, 150], [440, 140], [450, 130]],
};

scenes["offset-nested"] = {
  html:
    abs("P", 100, 100, 240, 140, "transform:rotate(20deg)", abs("C", 30, 30, 100, 60, "transform:scale(1.5)", abs("G", 10, 10, 40, 20))),
  clicks: [[220, 170], [180, 150], [250, 200], [140, 120], [270, 220], [230, 190]],
};

scenes["offset-translate"] = {
  html: abs("t", 100, 100, 100, 100, "transform:translate(30.5px, 12.25px)"),
  clicks: [[150, 150], [135, 115], [220, 130]],
};

scenes["offset-origin"] = {
  html: abs("t", 100, 100, 100, 60, "transform:rotate(40deg);transform-origin:0 0") + abs("u", 400, 100, 100, 60, "transform:scale(1.5) rotate(10deg);transform-origin:100% 100%"),
  clicks: [[150, 150], [120, 140], [110, 105], [180, 200], [450, 140], [430, 110], [500, 150]],
};

// scrollIntoView aims at the box that holds the corners of a transformed target.
scenes["into-view"] = {
  html: abs(
    "S", 20, 30, 200, 100, SCROLLER,
    `<div id="sp" style="position:relative;width:400px;height:1500px">` +
      abs("T", 50, 400, 40, 40, "transform:rotate(45deg)") +
      abs("U", 120, 800, 40, 40, "transform:scale(2)") +
      abs("V", 300, 1200, 40, 40, "transform:translate(-100px, 0)") +
      `</div>`
  ),
  into: [["T", { block: "start", inline: "nearest" }], ["U", { block: "center", inline: "nearest" }], ["V", { block: "end", inline: "start" }]],
};

// scrollIntoView and focus through nested scrollers: an outer scroller O holds an inner scroller I (a transform on one or
// both of them) that holds the target T (a transform of its own). Chrome aligns the box that holds the target in the space
// of each scroller in turn.
{
  const nest = (outerCss, innerCss, targetCss, reset) => ({
    html: abs(
      "O", 20, 20, 300, 200, SCROLLER + outerCss,
      `<div id="op" style="position:relative;width:900px;height:1200px">` +
        abs(
          "I", 120, 300, 220, 140, SCROLLER + innerCss,
          `<div id="ip" style="position:relative;width:600px;height:900px">` + abs("T", 300, 500, 50, 30, "background:red;" + targetCss) + `</div>`
        ) +
        `</div>`
    ),
    nest: { reset, ops: [] },
  });
  const OPS = [];
  for (const block of ["start", "center", "end", "nearest"]) for (const inline of ["start", "center", "end", "nearest"]) OPS.push({ block, inline });
  OPS.push("focus");
  const RESET = [["O", 0, 0], ["I", 0, 0]];
  const RESET_SCROLLED = [["O", 70, 40], ["I", 90, 30]];
  const scenesOfNest = {
    "nest-plain": nest("", "", "", RESET),
    "nest-rotate": nest("", "transform:rotate(20deg)", "", RESET),
    "nest-scale": nest("", "transform:scale(1.4, 0.8)", "transform:scale(1.3)", RESET),
    "nest-target": nest("", "", "transform:rotate(30deg)", RESET),
    "nest-both": nest("transform:rotate(10deg)", "transform:rotate(25deg)", "transform:rotate(30deg)", RESET_SCROLLED),
    "nest-skew": nest("", "transform:skew(15deg, 8deg)", "transform:scale(1.2)", RESET_SCROLLED),
    "nest-outer-scale": nest("transform:scale(0.7)", "transform:rotate(-15deg)", "", RESET_SCROLLED),
    "nest-turn": nest("", "transform:rotate(90deg)", "transform:rotate(45deg)", RESET),
  };
  for (const [name, scene] of Object.entries(scenesOfNest)) {
    scene.nest.ops = OPS;
    scenes[name] = scene;
  }
}

// Scroll extents: a scroller of 120x80 holding a transformed child.
{
  const extents = [
    ["e1", "", abs("c", 0, 0, 100, 50, "transform:scale(2)")],
    ["e2", "", abs("c", 0, 0, 100, 50, "transform:scale(2);transform-origin:0 0")],
    ["e3", "", abs("c", 20, 10, 100, 50, "transform:rotate(45deg)")],
    ["e4", "", abs("c", 0, 0, 50, 30, "transform:translate(150px, 20px)")],
    ["e5", "", abs("c", 60, 40, 100, 60, "transform:translate(-50px, -20px)")],
    ["e6", "", abs("c", 0, 0, 50, 30, "transform:translateY(300px)")],
    ["e7", "", `<div style="height:200px;width:50px"></div>` + abs("c", 0, 0, 40, 40, "transform:translate(500px, 0)")],
    ["e8", "", abs("c", 0, 0, 100, 50, "", abs("g", 10, 10, 50, 50, "transform:scale(3);transform-origin:0 0"))],
    ["e9", "transform:scale(2);", abs("c", 0, 0, 300, 200)],
    ["e10", "", abs("c", 0, 0, 60, 40, "transform:translate(100%, 100%) rotate(20deg)")],
    ["e11", "", abs("c", 0, 0, 60, 40, "transform:skew(30deg, 20deg)")],
    ["e12", "padding:10px 20px 15px 5px;", abs("c", 0, 0, 100, 50, "transform:scale(2)")],
    ["e13", "", abs("c", 0, 0, 100, 50, "transform:rotate(180deg)")],
    ["e14", "", abs("c", 0, 0, 100, 50, "transform:translate(40px, 30px)", abs("g", 10, 10, 50, 50, "transform:scale(3);transform-origin:0 0"))],
    ["e15", "", abs("c", 200, 150, 100, 50, "transform:scale(0.25)")],
    ["e16", "", abs("c", 0, 0, 100, 50, "transform:scale(0)")],
    ["e17", "padding:10px 20px 15px 5px;", abs("c", 0, 0, 200, 100)],
    // The end of a transition of translateX(400px) in a box that hides its overflow, and in one that scrolls it.
    ["e18", "overflow:hidden;", abs("c", 0, 0, 50, 30, "transform:translateX(400px)")],
    ["e19", "", abs("c", 0, 0, 50, 30, "transform:translateX(400px)")],
  ];
  scenes["extent"] = {
    html: extents
      .map(([id, css, inner], i) =>
        abs(id, 10 + (i % 4) * 190, 10 + Math.floor(i / 4) * 140, 120, 80, SCROLLER + css, inner.replace(/id="c"/, `id="${id}c"`).replace(/id="g"/, `id="${id}g"`))
      )
      .join(""),
  };
}

function measure(name, scene) {
  const holder = document.createElement("div");
  holder.id = "case";
  holder.style.cssText = "position:absolute;left:0;top:0;width:800px;height:600px";
  holder.innerHTML = scene.html;
  document.body.appendChild(holder);
  for (const [id, top, left] of scene.scroll ?? []) {
    const el = document.getElementById(id);
    el.scrollTop = top;
    el.scrollLeft = left;
  }
  const scrolls = [];
  for (const [id, options] of scene.into ?? []) {
    document.getElementById(id).scrollIntoView(options);
    scrolls.push([id, document.getElementById("S").scrollTop, document.getElementById("S").scrollLeft]);
  }
  const nested = [];
  const nest = scene.nest;
  if (nest) {
    const O = document.getElementById("O");
    const I = document.getElementById("I");
    const T = document.getElementById("T");
    T.tabIndex = 0;
    for (const op of nest.ops) {
      for (const [id, top, left] of nest.reset) {
        const el = document.getElementById(id);
        el.scrollTop = top;
        el.scrollLeft = left;
      }
      if (op === "focus") T.focus();
      else T.scrollIntoView(op);
      nested.push([O.scrollTop, O.scrollLeft, I.scrollTop, I.scrollLeft]);
    }
    for (const [id, top, left] of nest.reset) {
      const el = document.getElementById(id);
      el.scrollTop = top;
      el.scrollLeft = left;
    }
    document.activeElement?.blur();
  }
  const boxes = {};
  const sizes = {};
  for (const el of holder.querySelectorAll("[id]")) {
    const r = el.getBoundingClientRect();
    boxes[el.id] = [r.x, r.y, r.width, r.height];
    sizes[el.id] = [el.offsetLeft, el.offsetTop, el.offsetWidth, el.offsetHeight, el.clientWidth, el.clientHeight, el.scrollWidth, el.scrollHeight];
  }
  // Chrome hit tests a point as a small area, so a point within a pixel of an edge can hit what the edge encloses
  // although it is outside it. Only the points whose answer does not change a pixel around are kept.
  const at = (x, y) => {
    const hit = document.elementFromPoint(x, y);
    return hit === document.body || hit === document.documentElement ? null : hit.id;
  };
  const from = {};
  for (const [x, y] of scene.points ?? []) {
    const answer = at(x, y);
    let stable = true;
    for (const dx of [-1, 0, 1]) for (const dy of [-1, 0, 1]) stable = stable && at(x + dx, y + dy) === answer;
    if (stable) from[`${x},${y}`] = answer;
  }
  const offsets = {};
  for (const [x, y] of scene.clicks ?? []) {
    const target = document.elementFromPoint(x, y);
    let seen = null;
    const listener = (e) => {
      if (e.target === target && seen === null) seen = [target.id, e.offsetX, e.offsetY];
    };
    target.addEventListener("click", listener);
    target.dispatchEvent(new PointerEvent("click", { clientX: x, clientY: y, bubbles: true }));
    target.removeEventListener("click", listener);
    offsets[`${x},${y}`] = seen;
  }
  holder.remove();
  return { html: scene.html, scroll: scene.scroll ?? [], into: scene.into ?? [], scrolls, nest: scene.nest ?? null, nested, boxes, sizes, from, offsets };
}

const out = {};
for (const [name, scene] of Object.entries(scenes)) out[name] = measure(name, scene);
document.body.setAttribute("data-oracle", JSON.stringify(out));
</script>
</body>
</html>
