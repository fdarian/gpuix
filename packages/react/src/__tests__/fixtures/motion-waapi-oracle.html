async function runDef(def) {
  def.peek = def.group === "controls";
  const c = new Ctx(def);
  if (def.kind === "vanilla") {
    let el;
    if (def.tag === "svg-rect") {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      el = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      el.setAttribute("width", "50"); el.setAttribute("height", "50"); el.setAttribute("fill", "red");
      svg.appendChild(el);
      stage.appendChild(svg);
    } else {
      el = document.createElement("div");
      el.className = "box";
      stage.appendChild(el);
    }
    el.id = def.id;
    if (def.style) el.style.cssText = def.style;
    c.el = el;
    c.initialStyle = el.getAttribute("style");
  } else {
    rc(c);
  }
  c.start();
  let error = null;
  try { await def.run(c); } catch (e) { error = String(e && e.stack || e); }
  c.sample("final");
  if (c.ctrl && c.ctrl.stop) { try { c.ctrl.stop(); } catch (e) {} }
  const listedEver = c.samples.some((s) => s.n > 0);
  return { id: def.id, group: def.group, desc: def.desc, kind: def.kind, tag: def.tag || null, style: def.style || "", initialStyle: c.initialStyle || null, error, listedEver, calls: CALLS, samples: c.samples };
}

function metaInfo() {
  return {
    userAgent: navigator.userAgent,
    motionExports: ["animate", "supportsBrowserAnimation", "supportsLinearEasing"].map((k) => k + ":" + typeof Motion[k]),
    supportsLinearEasing: peek(() => Motion.supportsLinearEasing()),
    note: "vanilla cases use vendor/motion.js (motion@14.1.0 dist/motion.js UMD); react cases use vendor/motion-react.js (bun build of framer-motion@14.1.0 + react 19.3.0)",
  };
}

// ?list=1 prints the case ids; ?case=<id> runs one case alone (own page = own Motion frameloop and keyframe-resolver
// queue, so cases cannot flush each other's pending resolvers); no query runs every case concurrently.
async function main() {
  await frame();
  const params = new URLSearchParams(location.search);
  let out;
  if (params.has("list")) {
    out = { ids: defs.map((d) => d.id) };
  } else if (params.has("case")) {
    const def = defs.find((d) => d.id === params.get("case"));
    out = { meta: metaInfo(), cases: [await runDef(def)] };
  } else {
    out = { meta: metaInfo(), cases: await Promise.all(defs.map(runDef)) };
  }
  window.__oracle = out;
  const json = JSON.stringify(out, (k, v) => (v === Infinity ? "Infinity" : v === -Infinity ? "-Infinity" : Number.isNaN(v) ? "NaN" : v === undefined ? "<undefined>" : v));
  document.documentElement.setAttribute("data-oracle", json);
}
