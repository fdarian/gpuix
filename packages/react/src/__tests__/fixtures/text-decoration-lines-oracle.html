<!doctype html>
<!--
  Oracle for text-decoration-lines.test.tsx: where headless Chrome draws the strike-through and the overline of a
  decorating box and of the boxes inside it, and how it lays out the marks of a dashed or dotted line. Every case is
  a band with text; the script (text-decoration-lines-oracle.sh) reads the red pixels of its screenshot at device
  scale 1 and 2, row by row: for each row with red in it, the runs of red along x.
-->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;background:#fff}
.band{position:absolute;left:0;width:600px;height:60px;background:#fff;color:#000;font:16px/24px Helvetica;padding-top:10px}
</style></head><body>
<div id="scene"></div>
<script>
const L = (line, extra = '') => `text-decoration:${line} #f00;${extra}`;
// [name, band style, html, height]
const cases = [];
const add = (name, bandStyle, html, height = 60) => cases.push([name, bandStyle, html, height]);

// Where a strike-through and an overline are drawn.
for (const line of ['line-through', 'overline']) {
  const tag = line === 'line-through' ? 'strike' : 'over';
  add(`${tag} plain 16`, '', `<span style="${L(line)}">xxxx</span>`);
  add(`${tag} plain 33`, 'font-size:33px;line-height:41px', `<span style="${L(line)}">xxxx</span>`);
  add(`${tag} plain 10`, 'font-size:10px;line-height:14px', `<span style="${L(line)}">xxxx</span>`);
  for (const thickness of ['2px', '4px', '0.2em']) {
    add(`${tag} thickness ${thickness}`, '', `<span style="${L(line, `text-decoration-thickness:${thickness}`)}">xxxx</span>`);
  }
  for (const [name, style] of [
    ['super', 'vertical-align:super'],
    ['sub', 'vertical-align:sub'],
    ['text-top', 'vertical-align:text-top'],
    ['text-bottom', 'vertical-align:text-bottom'],
    ['middle', 'vertical-align:middle'],
    ['length', 'vertical-align:6px'],
    ['bigger font', 'font-size:28px'],
    ['smaller font', 'font-size:10px'],
    ['super smaller font', 'vertical-align:super;font-size:10px'],
    ['bigger font super', 'vertical-align:super;font-size:28px'],
    ['line height', 'line-height:44px'],
  ]) {
    add(`${tag} parent child ${name}`, '', `<span style="${L(line)}"><span>xx</span><span style="${style}">xx</span><span>xx</span></span>`);
  }
  add(`${tag} nested super super`, '', `<span style="${L(line)}"><span>xx</span><span style="vertical-align:super"><span>xx</span><span style="vertical-align:super">xx</span></span><span>xx</span></span>`);
  add(`${tag} raised decorating box`, '', `<span>xx</span><span style="vertical-align:super;${L(line)}"><span>xx</span><span>xx</span><span style="vertical-align:sub">xx</span></span><span>xx</span>`);
  add(`${tag} bigger decorating box`, '', `<span>xx</span><span style="font-size:30px;${L(line)}"><span>xx</span><span style="font-size:12px">xx</span></span><span>xx</span>`);
  add(`${tag} smaller decorating box`, '', `<span>xx</span><span style="font-size:11px;${L(line)}"><span>xx</span><span style="font-size:24px">xx</span></span><span>xx</span>`);
  add(`${tag} inner box declares its own`, '', `<span style="${L(line)}"><span>xx</span><span style="vertical-align:super;text-decoration:${line} #00f">xx</span><span>xx</span></span>`);
}

// Marks of a dashed or dotted line. A style of 'x' is a text of that many x, 8px wide each.
const xs = (n) => 'x'.repeat(n);
for (const style of ['dashed', 'dotted']) {
  const tag = style;
  for (const thickness of ['1px', '2px', '3px', '4px', '5px']) {
    for (const n of [1, 2, 3, 4, 5, 6, 7, 9, 11, 13, 17, 23]) {
      add(`${tag} ${thickness} ${n}`, '', `<span style="${L(`underline ${style}`, `text-decoration-thickness:${thickness}`)}">${xs(n)}</span>`, 40);
    }
  }
  const U = L(`underline ${style}`, 'text-decoration-thickness:2px');
  add(`${tag} two text nodes`, '', `<span style="${U}">${xs(5)}<!---->${xs(5)}</span>`, 40);
  add(`${tag} three text nodes`, '', `<span style="${U}">${xs(3)}<!---->${xs(4)}<!---->${xs(6)}</span>`, 40);
  add(`${tag} nested plain span`, '', `<span style="${U}">${xs(5)}<span>${xs(7)}</span>${xs(3)}</span>`, 40);
  add(`${tag} nested bold`, '', `<span style="${U}">${xs(6)}<span style="font-weight:700">${xs(6)}</span></span>`, 40);
  add(`${tag} nested bigger font`, '', `<span style="${U}">${xs(6)}<span style="font-size:24px">${xs(6)}</span>${xs(2)}</span>`, 40);
  add(`${tag} nested super`, '', `<span style="${U}">${xs(6)}<span style="vertical-align:super">${xs(6)}</span>${xs(3)}</span>`, 40);
  add(`${tag} nested other colour`, '', `<span style="${U}">${xs(5)}<span style="color:#0a0">${xs(7)}</span>${xs(4)}</span>`, 40);
  add(`${tag} nested padding`, '', `<span style="${U}">${xs(5)}<span style="padding:0 10px">${xs(7)}</span>${xs(4)}</span>`, 40);
  add(`${tag} nested own underline`, '', `<span style="${U}">${xs(5)}<span style="text-decoration:underline ${style} #00f;text-decoration-thickness:2px">${xs(7)}</span>${xs(4)}</span>`, 40);
  add(`${tag} sibling boxes`, '', `<span style="${U}">${xs(5)}</span><span style="${U}">${xs(7)}</span>`, 40);
  add(`${tag} with a space between`, '', `<span style="${U}">${xs(5)} ${xs(6)}</span>`, 40);
  add(`${tag} centered`, 'text-align:center', `<span style="${U}">${xs(5)}<span>${xs(7)}</span></span>`, 40);
  add(`${tag} right`, 'text-align:right', `<span style="${U}">${xs(5)}<span>${xs(7)}</span></span>`, 40);
  add(`${tag} wrapped`, 'width:130px', `<span style="${U}">${xs(5)} ${xs(5)} ${xs(6)} ${xs(2)}</span>`, 110);
  add(`${tag} wrapped nested`, 'width:130px', `<span style="${U}">${xs(5)} <span>${xs(5)} ${xs(6)}</span> ${xs(2)}</span>`, 110);
  add(`${tag} wrapped inside a nested box`, 'width:100px', `<span style="${U}">${xs(2)}<span> ${xs(5)} ${xs(6)} ${xs(4)}</span></span>`, 110);
  add(`${tag} strike`, '', `<span style="${L(`line-through ${style}`, 'text-decoration-thickness:2px')}">${xs(5)}<span>${xs(7)}</span></span>`, 40);
  add(`${tag} overline`, '', `<span style="${L(`overline ${style}`, 'text-decoration-thickness:2px')}">${xs(5)}<span>${xs(7)}</span></span>`, 40);
  add(`${tag} raised`, '', `<span style="${L(`underline ${style}`, 'text-decoration-thickness:2px')}">${xs(3)}<span style="vertical-align:super;font-size:10px">${xs(9)}</span>${xs(3)}</span>`, 40);
}
// A decoration the block itself declares, with boxes in its text.
for (const style of ['dashed', 'dotted']) {
  const band = `text-decoration:underline ${style} #f00;text-decoration-thickness:2px`;
  add(`${style} block nested`, band, `${xs(5)}<span style="color:#0a0">${xs(7)}</span>${xs(4)}`, 40);
  add(`${style} block nested bigger`, band, `${xs(5)}<span style="font-size:24px">${xs(4)}</span>${xs(4)}`, 40);
}
add('strike block nested bigger', 'text-decoration:line-through #f00', `${xs(3)}<span style="font-size:28px">${xs(3)}</span>${xs(3)}`);
add('over block nested bigger', 'text-decoration:overline #f00', `${xs(3)}<span style="font-size:28px">${xs(3)}</span>${xs(3)}`);
for (const n of [3, 5, 8]) {
  add(`wavy ${n}`, '', `<span style="${L('underline wavy', 'text-decoration-thickness:2px')}">${xs(n)}</span>`, 40);
}
add('wavy two text nodes', '', `<span style="${L('underline wavy', 'text-decoration-thickness:2px')}">${xs(5)}<!---->${xs(5)}</span>`, 40);
add('wavy nested', '', `<span style="${L('underline wavy', 'text-decoration-thickness:2px')}">${xs(5)}<span>${xs(7)}</span></span>`, 40);

const out = { cases: {} };
const scene = document.getElementById('scene');
let offset = 0;
for (const [name, bandStyle, html, height] of cases) {
  const band = document.createElement('div');
  band.className = 'band';
  band.style.cssText = `top:${offset}px;height:${height}px;${bandStyle}`;
  band.innerHTML = html;
  scene.appendChild(band);
  out.cases[name] = { top: offset, height, bandStyle, html };
  offset += height;
}
document.body.style.height = `${offset}px`;
const holder = document.createElement('div');
holder.setAttribute('data-oracle', JSON.stringify({ ...out, total: offset }));
document.body.appendChild(holder);
</script></body></html>
