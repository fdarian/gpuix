<!doctype html>
<!--
  Oracle for web-animations.test.tsx: what headless Chrome reports through `element.getAnimations()` for CSS
  transitions and CSS animations, and what the Animation API does to them. Regenerate with

    sh web-animations-oracle.sh

  The page holds three kinds of case, run in two ways.

  1. `cases` (the first kind), run by `--virtual-time-budget --dump-dom`. A case is an element with a style,
  optionally a second style that starts transitions, and steps run on the animations `getAnimations()` returned right
  after that (the "tracked" ones, by index). Every step records what Chrome shows at that point: the width and height
  of the element, and for each tracked animation its class, name, `playState`, `currentTime`, `playbackRate` and which
  `finished` promise object it holds (0 is the first one it had, 1 the one that replaced it). A `list` step records
  what `getAnimations()` returns then. Steps run in one task, so no frame passes between them; Chrome's own timeline
  time stays at the first frame and a running animation reads 0. Changing only the playbackRate does not make Chrome
  sample the effect again, so a value or list read right after one is the old direction's: the cases move the time
  after it. `settle` waits two frames and records how every `finished` promise each animation held stands: a cancel
  rejects the promise held and leaves a new pending one. Keyframes: `grow` is the width from 100px to 200px, `tall`
  the height from 10px to 30px.

  2. `apiCases`, the same record format with more steps and fields, and 3. `treeCases`, several elements. Both are run
  by web-animations-oracle.mjs, in a headless Chrome of its own, in real time and at 60Hz: the virtual time run draws
  one frame and no more, so no event, no `ready` and no start time ever arrives in it. Real frames take real time,
  so `settle` stops the clock: it records `currentTime` as it was when it began (a running or paused animation is put
  back to it afterwards), and so the numbers are what a page on a clock that does not run between frames would show.
  A finished animation is left alone. The time between two frames is never recorded.

  Steps of `apiCases` (index = the tracked animation), on top of pause, play, seek, rate, style, remove, list, settle:
    cancel i, finish i, reverse i, updateRate i r (updatePlaybackRate), startTime i v (a number, null, or "now",
    "now-300", "now+100": relative to document.timeline.currentTime), updateTiming i {..} ("Infinity" for the number),
    track (adds the animations getAnimations() lists now that are not tracked yet, at the end of the animations
    array), keyframes i, timing i, computed i (getKeyframes(), getTiming(), getComputedTiming()), sample i [t..] (sets
    currentTime to each t and records the computed timing and the width there). A step that throws records `threw`.
  Fields of a record, besides the first kind's: `events` (everything logged since the last record, in order: DOM events
  of the element "animationstart name elapsed=.. pseudo=", Animation events "a0.finish currentTime=.. timelineTime=before"
  where timelineTime is only said to be before, now or after the timeline's time at dispatch, "(handler)" for
  onfinish/oncancel/onremove set before the listener, and promise settlements "a0.finished rejected:AbortError",
  "a0.ready resolved"), `listIndex` (for `list`: which tracked animation each listed one is, -1 for none), `keyframes`,
  `timing`, `computedTiming`, `samples`, `threw`, `ready` (like `finished`, for the `ready` promises, on `settle`).
  Per animation, besides the first kind's: `pending`, `readyGeneration` (like finishedGeneration), `hasStartTime`,
  `startTimeAge` (timeline time minus startTime, for a running animation only; null otherwise or at a rate of 0),
  `effectTarget` (element | null | other | noeffect), `timelineIsDocument`. Numbers are rounded to 3 decimals,
  and Infinity is the string "Infinity". A microtask checkpoint runs after each step, so a promise settled by
  a step is logged under it.

  Steps of `treeCases` (a tree of divs `r` > `a`, `b`, ..., an id each; the animations are named `kind:name@id` with
  the pseudo-element after it): list (records the lists at once), styles {id: style} (one style flush for all),
  classes {id: className}, cancel id i, finish id i, play id i (the animation cancel or finish took), add parent node
  before, remove id, move id parent before, settle. A record has `own` (id -> element.getAnimations()), `subtree`
  (id -> getAnimations({subtree: true})) and `document` (document.getAnimations()).
-->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;border:0 solid transparent}
body{font:16px/20px Menlo;color:#000}
</style></head><body>
<script>
const KEYFRAMES = {
  grow: { from: { width: 100 }, to: { width: 200 } },
  tall: { from: { height: 10 }, to: { height: 30 } },
};
const BASE = { width: '50px', height: '20px', marginLeft: '0px', marginTop: '0px' };
// The keyframes the second and third kinds of case add; `KEYFRAMES` above is all the first kind uses.
const RICH_KEYFRAMES = {
  mid: '50%{width:150px}',
  onlyfrom: 'from{width:100px}',
  onlyto: 'to{width:200px}',
  pop: '0%{width:100px}50%{width:150px;animation-timing-function:ease-in}100%{width:200px}',
  multi: '0%{width:100px;height:10px}30%{width:120px}100%{width:200px;height:30px;margin-left:20px}',
  comp: '0%{width:10px;animation-composition:add}100%{width:20px}',
  rel: 'from{width:50%;background-color:red;margin-left:1em}to{width:calc(10px + 20%);background-color:#00f;margin-left:calc(1em + 2px)}',
  twice: '0%{width:100px}50%{width:120px}50%{height:30px}100%{width:200px}',
  unordered: '100%{width:200px}0%{width:100px}50%{width:150px}',
};
const PSEUDO_CSS = [
  '.pb::before{content:"";display:block;width:10px;height:10px;animation:grow 1s linear}',
  '.pa::after{content:"";display:block;width:10px;height:10px;animation:tall 1s linear}',
  '.pt::before{content:"";display:block;margin-top:0;transition:margin-top 1s}',
  '.pt2::before{margin-top:10px}',
].join('');
const css = Object.entries(RICH_KEYFRAMES).map(([name, body]) => `@keyframes ${name}{${body}}`).join('') + PSEUDO_CSS + Object.entries(KEYFRAMES).map(([name, frames]) =>
  `@keyframes ${name}{${Object.entries(frames).map(([k, v]) =>
    `${k}{${Object.entries(v).map(([p, n]) => `${p}:${n}px`).join(';')}}`).join('')}}`).join('');
const sheet = document.createElement('style'); sheet.textContent = css; document.head.appendChild(sheet);

// [name, style, change, steps]
const cases = [
  ['a transition paused and sought',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['pause', 0], ['seek', 0, 250], ['seek', 0, 500], ['seek', 0, 1000], ['seek', 0, 0], ['list']]],
  ['an animation paused and sought',
    { animation: 'grow 1s linear' }, null,
    [['pause', 0], ['seek', 0, 250], ['seek', 0, 750], ['seek', 0, 1000], ['list']]],
  ['a playbackRate of 2 and -1 change nothing about the value at a time',
    { animation: 'grow 1s linear' }, null,
    [['rate', 0, 2], ['pause', 0], ['seek', 0, 250], ['rate', 0, -1], ['seek', 0, 750], ['rate', 0, 0.5], ['seek', 0, 500]]],
  ['a running animation keeps its time when the rate changes',
    { animation: 'grow 1s linear' }, null,
    [['seek', 0, 400], ['rate', 0, 2], ['rate', 0, -1], ['rate', 0, 1]]],
  ['a positive delay is not part of currentTime at the start',
    { animation: 'grow 1s linear 500ms, tall 1s linear -300ms' }, null,
    [['pause', 0], ['pause', 1], ['seek', 0, 500], ['seek', 0, 750], ['seek', 1, 400], ['seek', 1, 700], ['seek', 1, 100]]],
  ['a transition with a delay starts at 0',
    { transition: 'width 1s linear 500ms' }, { width: '150px' },
    [['pause', 0], ['seek', 0, 500], ['seek', 0, 1000], ['seek', 0, 1500]]],
  ['two transitions and two animations in one style change',
    { transition: 'margin-top 1s, margin-left 1s', animation: 'tall 1s linear, grow 1s linear' },
    { marginTop: '10px', marginLeft: '10px' },
    [['list']]],
  ['transitions in the order of the style changes that started them',
    { transition: 'margin-top 1s, margin-left 1s, width 1s' }, { marginTop: '10px' },
    [['style', { width: '100px' }], ['style', { marginLeft: '10px' }], ['list'], ['style', { marginTop: '0px', width: '60px' }], ['list']]],
  ['fill forwards is listed after the end',
    { animation: 'grow 1s linear forwards' }, null,
    [['seek', 0, 1000], ['list'], ['settle'], ['list']]],
  ['fill none is not listed after the end',
    { animation: 'grow 1s linear' }, null,
    [['seek', 0, 1000], ['list'], ['settle'], ['list']]],
  ['fill backwards is not listed after the end',
    { animation: 'grow 1s linear backwards' }, null,
    [['seek', 0, 1000], ['list']]],
  ['a paused animation at its end is not listed without a fill',
    { animation: 'grow 1s linear' }, null,
    [['pause', 0], ['seek', 0, 999], ['list'], ['seek', 0, 1000], ['list'], ['settle'], ['list']]],
  ['a paused animation at its end is listed through a fill',
    { animation: 'grow 1s linear forwards' }, null,
    [['pause', 0], ['seek', 0, 1000], ['list'], ['settle'], ['list']]],
  ['a paused animation run back to its start is not listed without a backwards fill',
    { animation: 'grow 1s linear' }, null,
    [['pause', 0], ['seek', 0, 500], ['rate', 0, -1], ['seek', 0, 1], ['list'], ['seek', 0, 0], ['list'], ['settle'], ['list']]],
  ['a running animation run back to its start is finished and not listed',
    { animation: 'grow 1s linear' }, null,
    [['seek', 0, 500], ['rate', 0, -1], ['seek', 0, 0], ['list'], ['settle'], ['list']]],
  ['a rate of -1 at the start of the delay is not listed, at the end of the effect it is',
    { animation: 'grow 1s linear 500ms' }, null,
    [['pause', 0], ['seek', 0, 1000], ['rate', 0, -1], ['seek', 0, 1499], ['list'], ['seek', 0, 600], ['list'], ['seek', 0, 500], ['list']]],
  ['a backwards fill lists an animation run back to its start',
    { animation: 'grow 1s linear backwards' }, null,
    [['pause', 0], ['seek', 0, 500], ['rate', 0, -1], ['seek', 0, 0], ['list']]],
  ['play after finish rewinds to 0',
    { animation: 'grow 1s linear both' }, null,
    [['seek', 0, 1000], ['settle'], ['play', 0], ['list']]],
  ['play after finish at a rate of -1 goes to the end',
    { animation: 'grow 1s linear both' }, null,
    [['pause', 0], ['rate', 0, -1], ['seek', 0, 0], ['play', 0], ['list']]],
  ['play on a paused animation at its end rewinds to 0',
    { animation: 'grow 1s linear both' }, null,
    [['pause', 0], ['seek', 0, 1000], ['play', 0]]],
  ['play on a paused animation keeps its time',
    { animation: 'grow 1s linear both' }, null,
    [['pause', 0], ['seek', 0, 400], ['play', 0]]],
  ['pause then animationPlayState changes are ignored',
    { animation: 'grow 1s linear' }, null,
    [['pause', 0], ['style', { animationPlayState: 'paused' }], ['style', { animationPlayState: 'running' }]]],
  ['play then animationPlayState changes are ignored',
    { animation: 'grow 1s linear', animationPlayState: 'paused' }, null,
    [['play', 0], ['style', { animationPlayState: 'running' }], ['style', { animationPlayState: 'paused' }]]],
  ['animationPlayState decides until the API is used',
    { animation: 'grow 1s linear', animationPlayState: 'paused' }, null,
    [['style', { animationPlayState: 'running' }], ['style', { animationPlayState: 'paused' }]]],
  ['removing the animation name cancels it',
    { animation: 'grow 1s linear forwards' }, null,
    [['pause', 0], ['seek', 0, 400], ['style', { animation: 'none' }], ['list'], ['settle']]],
  ['removing the name of a finished animation cancels it too',
    { animation: 'grow 1s linear forwards' }, null,
    [['seek', 0, 1000], ['settle'], ['style', { animation: 'none' }], ['settle']]],
  ['a transition replaced by another change is cancelled',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['pause', 0], ['seek', 0, 300], ['style', { width: '200px' }], ['list'], ['settle']]],
  ['finished resolves with the animation',
    { animation: 'grow 1s linear' }, null,
    [['seek', 0, 1000], ['settle']]],
  ['a finished transition keeps its end',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['seek', 0, 1000], ['settle'], ['list']]],
  ['a finished transition with a delay ends at delay plus duration',
    { transition: 'width 1s linear 500ms' }, { width: '150px' },
    [['seek', 0, 1500], ['settle'], ['list']]],
  ['a transition run backwards ends at 0',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['rate', 0, -1], ['settle']]],
  ['a transition run back to its start stays in effect',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['rate', 0, -1], ['list'], ['settle'], ['list']]],
  ['a transition with a delay run back to its start stays in effect',
    { transition: 'width 1s linear 500ms' }, { width: '150px' },
    [['rate', 0, -1], ['list'], ['settle'], ['list']]],
  ['play on a transition run back to its start goes to its end',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['rate', 0, -1], ['settle'], ['play', 0], ['list'], ['settle']]],
  ['pause and seek on a transition run back to its start',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['rate', 0, -1], ['settle'], ['pause', 0], ['list'], ['seek', 0, 500], ['list'], ['seek', 0, 0], ['list'], ['rate', 0, 1], ['list']]],
  ['a rate of 1 on a transition run back to its start runs it forward',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['rate', 0, -1], ['settle'], ['rate', 0, 1], ['list'], ['settle']]],
  ['a style change cancels a transition held at its start',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['rate', 0, -1], ['settle'], ['style', { width: '90px' }], ['list'], ['settle']]],
  ['the same style leaves a transition held at its start',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['rate', 0, -1], ['settle'], ['style', { width: '150px' }], ['list'], ['settle']]],
  ['play on a transition that finished plays it again',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['seek', 0, 1000], ['settle'], ['play', 0], ['list'], ['settle']]],
  ['pause on a transition that finished holds it at its end, unlisted',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['seek', 0, 1000], ['settle'], ['pause', 0], ['list'], ['seek', 0, 500], ['list'], ['seek', 0, 1000], ['list']]],
  ['a rate of -1 on a transition that finished runs it back',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['seek', 0, 1000], ['settle'], ['rate', 0, -1], ['list'], ['settle']]],
  ['seeking a transition that finished back into its effect',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['seek', 0, 1000], ['settle'], ['seek', 0, 250], ['list'], ['settle']]],
  ['a rate of 2 on a transition that finished leaves it finished',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['seek', 0, 1000], ['settle'], ['rate', 0, 2], ['list'], ['settle']]],
  ['a style change after a transition finished leaves it finished',
    { transition: 'width 1s linear' }, { width: '150px' },
    [['seek', 0, 1000], ['settle'], ['style', { width: '90px' }], ['list'], ['settle']]],
  ['removing the element cancels its animations',
    { animation: 'grow 1s linear forwards', transition: 'margin-top 1s' }, { marginTop: '10px' },
    [['pause', 0], ['pause', 1], ['remove'], ['settle']]],
  ['the same animation object on every call',
    { animation: 'grow 1s linear, tall 1s linear' }, null,
    [['same']]],
];

// Cases of the second kind: the Animation API on the same animations. They run on the `runApi` below, whose steps and
// record fields are listed in the header. [name, style, change, steps]
const API = (() => {
  const G = 'grow 1s linear';
  const T = { transition: 'width 1s linear' };
  const W = { width: '150px' };
  const cases = [];
  const add = (name, style, change, steps) => cases.push([name, style, change, steps]);

  // cancel()
  add('cancel a running animation', { animation: G }, null,
    [['seek', 0, 300], ['cancel', 0], ['list'], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('cancel an animation with a delay and a forwards fill', { animation: 'grow 1s linear 500ms forwards' }, null,
    [['pause', 0], ['seek', 0, 700], ['cancel', 0], ['list'], ['settle'], ['play', 0], ['settle']]);
  add('cancel an animation that finished', { animation: 'grow 1s linear forwards' }, null,
    [['seek', 0, 1000], ['settle'], ['cancel', 0], ['list'], ['settle'], ['cancel', 0], ['settle']]);
  add('cancel a paused animation', { animation: G }, null,
    [['pause', 0], ['seek', 0, 400], ['cancel', 0], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('cancel an animation at a rate of -1', { animation: 'grow 1s linear both' }, null,
    [['pause', 0], ['seek', 0, 600], ['rate', 0, -1], ['cancel', 0], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('cancel an animation of three alternate iterations', { animation: 'grow 1s linear 3 alternate' }, null,
    [['seek', 0, 1500], ['cancel', 0], ['settle'], ['play', 0], ['settle']]);
  add('cancel an infinite animation', { animation: 'grow 1s linear infinite' }, null,
    [['seek', 0, 2500], ['cancel', 0], ['settle'], ['play', 0], ['settle']]);
  add('cancel twice cancels once', { animation: G }, null,
    [['cancel', 0], ['cancel', 0], ['settle']]);
  add('cancel a pending animation before its first frame', { animation: G }, null,
    [['cancel', 0], ['settle'], ['list']]);
  add('a style change after a cancel that changes the animation', { animation: G }, null,
    [['cancel', 0], ['settle'], ['style', { animationDuration: '2s' }], ['list'], ['track'], ['settle']]);
  add('a style change after a cancel that leaves the animation alone', { animation: G }, null,
    [['cancel', 0], ['settle'], ['style', { height: '30px' }], ['list'], ['track'], ['settle']]);
  add('the name removed and set again after a cancel', { animation: G }, null,
    [['cancel', 0], ['settle'], ['style', { animation: 'none' }], ['list'], ['settle'], ['style', { animation: G }], ['list'], ['track'], ['settle']]);
  add('the name set again to the same value after a cancel', { animation: G }, null,
    [['cancel', 0], ['settle'], ['style', { animation: G }], ['list'], ['track'], ['settle']]);
  add('a cancelled animation among two', { animation: 'grow 1s linear, tall 1s linear' }, null,
    [['cancel', 0], ['list'], ['settle'], ['style', { animationDuration: '2s, 2s' }], ['list'], ['track'], ['settle']]);
  add('cancel a running transition', T, W,
    [['seek', 0, 300], ['cancel', 0], ['list'], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('cancel a transition with a delay', { transition: 'width 1s linear 500ms' }, W,
    [['pause', 0], ['seek', 0, 700], ['cancel', 0], ['list'], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('cancel a transition that finished', T, W,
    [['seek', 0, 1000], ['settle'], ['cancel', 0], ['list'], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('cancel a paused transition', T, W,
    [['pause', 0], ['seek', 0, 400], ['cancel', 0], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('cancel a transition at a rate of -1', T, W,
    [['pause', 0], ['seek', 0, 600], ['rate', 0, -1], ['cancel', 0], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('cancel a transition and change the property to a new value', T, W,
    [['cancel', 0], ['settle'], ['style', { width: '90px' }], ['list'], ['track'], ['settle']]);
  add('cancel a transition and change the property to the same value', T, W,
    [['cancel', 0], ['settle'], ['style', { width: '150px' }], ['list'], ['track'], ['settle']]);
  add('cancel a transition and change the property back', T, W,
    [['cancel', 0], ['settle'], ['style', { width: '50px' }], ['list'], ['track'], ['settle']]);
  add('cancel a transition twice', T, W,
    [['cancel', 0], ['cancel', 0], ['settle']]);

  // finish()
  add('finish a running animation', { animation: G }, null,
    [['seek', 0, 300], ['finish', 0], ['list'], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('finish an animation with a forwards fill', { animation: 'grow 1s linear forwards' }, null,
    [['finish', 0], ['list'], ['settle'], ['finish', 0], ['settle']]);
  add('finish an animation at a rate of -1', { animation: 'grow 1s linear both' }, null,
    [['pause', 0], ['seek', 0, 600], ['rate', 0, -1], ['finish', 0], ['list'], ['settle']]);
  add('finish an animation at a rate of 0', { animation: G }, null,
    [['seek', 0, 300], ['rate', 0, 0], ['finish', 0], ['settle']]);
  add('finish an infinite animation', { animation: 'grow 1s linear infinite' }, null,
    [['seek', 0, 300], ['finish', 0], ['settle']]);
  add('finish an infinite animation at a rate of -1', { animation: 'grow 1s linear infinite both' }, null,
    [['seek', 0, 300], ['rate', 0, -1], ['finish', 0], ['list'], ['settle']]);
  add('finish an animation with a delay and iterations', { animation: 'grow 1s linear 500ms 2 alternate forwards' }, null,
    [['finish', 0], ['list'], ['settle']]);
  add('finish an animation of 2.5 iterations', { animation: 'grow 1s linear 2.5 forwards' }, null,
    [['finish', 0], ['settle']]);
  add('finish an animation with a negative delay', { animation: 'grow 1s linear -300ms forwards' }, null,
    [['finish', 0], ['settle']]);
  add('finish a paused animation', { animation: G }, null,
    [['pause', 0], ['seek', 0, 300], ['finish', 0], ['list'], ['settle']]);
  add('finish a cancelled animation', { animation: 'grow 1s linear forwards' }, null,
    [['cancel', 0], ['settle'], ['finish', 0], ['list'], ['settle']]);
  add('finish an animation with a zero duration', { animation: 'grow 0s linear forwards' }, null,
    [['finish', 0], ['settle']]);
  add('finish a running transition', T, W,
    [['seek', 0, 300], ['finish', 0], ['list'], ['settle'], ['play', 0], ['list'], ['settle']]);
  add('finish a transition at a rate of -1', T, W,
    [['rate', 0, -1], ['seek', 0, 600], ['finish', 0], ['list'], ['settle']]);
  add('finish a transition at a rate of 0', T, W,
    [['seek', 0, 300], ['rate', 0, 0], ['finish', 0], ['settle']]);
  add('finish a transition with a delay', { transition: 'width 1s linear 500ms' }, W,
    [['finish', 0], ['list'], ['settle']]);
  add('finish a paused transition', T, W,
    [['pause', 0], ['seek', 0, 300], ['finish', 0], ['list'], ['settle']]);
  add('finish a cancelled transition', T, W,
    [['cancel', 0], ['settle'], ['finish', 0], ['list'], ['settle']]);

  // reverse()
  add('reverse a running animation', { animation: 'grow 1s linear both' }, null,
    [['seek', 0, 300], ['reverse', 0], ['list'], ['settle'], ['reverse', 0], ['settle']]);
  add('reverse a paused animation', { animation: 'grow 1s linear both' }, null,
    [['pause', 0], ['seek', 0, 300], ['reverse', 0], ['settle'], ['pause', 0], ['settle']]);
  add('reverse a finished animation', { animation: 'grow 1s linear forwards' }, null,
    [['seek', 0, 1000], ['settle'], ['reverse', 0], ['list'], ['settle']]);
  add('reverse a cancelled animation', { animation: 'grow 1s linear both' }, null,
    [['seek', 0, 300], ['cancel', 0], ['settle'], ['reverse', 0], ['list'], ['settle']]);
  add('reverse an animation at its start', { animation: 'grow 1s linear both' }, null,
    [['reverse', 0], ['list'], ['settle']]);
  add('reverse an animation at its end that has not finished', { animation: 'grow 1s linear both' }, null,
    [['pause', 0], ['seek', 0, 1000], ['reverse', 0], ['settle']]);
  add('reverse an animation with a delay', { animation: 'grow 1s linear 500ms both' }, null,
    [['seek', 0, 700], ['reverse', 0], ['list'], ['settle'], ['seek', 0, 0], ['reverse', 0], ['settle']]);
  add('reverse an animation of several iterations', { animation: 'grow 1s linear 3 alternate both' }, null,
    [['seek', 0, 1500], ['reverse', 0], ['settle'], ['seek', 0, 0], ['reverse', 0], ['settle']]);
  add('reverse an infinite animation', { animation: 'grow 1s linear infinite both' }, null,
    [['seek', 0, 300], ['reverse', 0], ['settle'], ['reverse', 0], ['settle']]);
  add('reverse an infinite animation at its start', { animation: 'grow 1s linear infinite both' }, null,
    [['reverse', 0], ['settle']]);
  add('reverse an animation at a rate of 2 and -0.5', { animation: 'grow 1s linear both' }, null,
    [['seek', 0, 400], ['rate', 0, 2], ['reverse', 0], ['settle'], ['rate', 0, -0.5], ['reverse', 0], ['settle']]);

// Cases of the third kind: several elements. A node is [id, style, change, children, className]; `style` is applied
// when the node is added, `change` in a second flush right after it (it starts transitions). [name, tree, steps]
const TREES = (() => {
  const cases = [];
  const add = (name, tree, steps) => cases.push([name, tree, steps]);
  const node = (id, style, change, children, className) => [id, style, change || null, children || [], className || null];
  const MT = { transition: 'margin-top 1s' };
  const ML = { transition: 'margin-left 1s' };

  add('transitions come before animations across elements',
    node('r', { animation: 'tall 1s linear' }, null, [
      node('a', { animation: 'grow 1s linear' }),
      node('b', MT, { marginTop: '10px' }),
    ]),
    [['list']]);
  add('a child animation, a parent animation and a sibling transition',
    node('r', {}, null, [
      node('a', { animation: 'grow 1s linear' }, null, [node('a1', { animation: 'tall 1s linear' })]),
      node('b', ML, { marginLeft: '10px' }),
    ]),
    [['list']]);
  add('animations of one element in the order of the names',

const DOM_EVENTS = ['animationstart', 'animationiteration', 'animationend', 'animationcancel',

async function runApi([name, style, change, steps]) {

  const finishedSeen = [];
  const readySeen = [];

    if (seen.includes(promise)) return;

    promise.then(() => log.push(`a${index}.${which} resolved`), (e) => log.push(`a${index}.${which} rejected:${e.name}`));

    promise.then((value) => (value === animation ? 'resolved' : 'resolved-other'),

async function runTree([name, tree, steps]) {
  const els = {};
  const ids = new Map();
  const build = (n, parent, before) => {
    const [id, style, , children, className] = n;
    const e = document.createElement('div');
    apply(e, BASE);
    apply(e, style);
    if (className) e.className = className;
    els[id] = e;
    ids.set(e, id);
    parent.insertBefore(e, before);
    for (const child of children) build(child, e, null);

  build(tree, document.body, null);
  flush(els[tree[0]]);
  for (const [id, change] of changes(tree, [])) apply(els[id], change);
  flush(els[tree[0]]);
  const label = (a) => `${a.constructor.name}:${nameOf(a)}@${ids.get(a.effect.target)}${a.effect.pseudoElement ?? ''}`;
  const held = {};
  const read = () => ({
    own: Object.fromEntries(Object.entries(els).map(([id, e]) => [id, e.getAnimations().map(label)])),
    subtree: Object.fromEntries(Object.entries(els).map(([id, e]) => [id, e.getAnimations({ subtree: true }).map(label)])),
    document: document.getAnimations().map(label),
  });
  const records = [{ step: ['start'], ...read() }];
  for (const step of steps) {
    const [op, a, b, c] = step;
    const record = { step };
    try {
      if (op === 'styles') { for (const [id, style] of Object.entries(a)) apply(els[id], style); flush(els.r); }
      else if (op === 'classes') { for (const [id, className] of Object.entries(a)) els[id].className = className; flush(els.r); }
      else if (op === 'cancel') { held[`${a}:${b}`] = els[a].getAnimations()[b]; held[`${a}:${b}`].cancel(); }
      else if (op === 'finish') { held[`${a}:${b}`] = els[a].getAnimations()[b]; held[`${a}:${b}`].finish(); }
      else if (op === 'play') held[`${a}:${b}`].play();
      else if (op === 'add') {
        build(b, els[a], c ? els[c] : null);
        flush(els.r);
        for (const [id, change] of changes(b, [])) apply(els[id], change);
        flush(els.r);
      } else if (op === 'remove') els[a].remove();
      else if (op === 'move') { els[b].insertBefore(els[a], c ? els[c] : null); flush(els.r); }
      else if (op === 'settle') await settleFrames();
    } catch (e) { record.threw = e instanceof DOMException ? e.name : `${e.name}`; }
    await microtasks();
    Object.assign(record, read());
    records.push(record);
  }
  els[tree[0]].remove();
  return { name, tree, steps, records };
}
