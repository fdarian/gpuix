<!doctype html>
<!--
  Oracle for inline-container-display.test.tsx: the expected numbers there are what headless Chrome
  lays out for these pages. Regenerate (and read the numbers) with

    CHROME=/Users/farreldarian/Library/Caches/ms-playwright/chromium_headless_shell-1248/chrome-headless-shell-mac-arm64/chrome-headless-shell
    $CHROME --headless --window-size=1280,800 --virtual-time-budget=3000 --allow-file-access-from-files --dump-dom file:///<this file> \
      | grep -o 'data-rects="[^"]*"' | sed 's/&quot;/"/g'

  The text is GpuixTestSquare at 20px with a line height of 20px: every character is 20px wide,
  the ascent is the whole em and there is no descent. `data-id` names a box in the test as
  `case.name`, and the numbers are relative to the `data-case` box it is in. Each case is laid
  out at 300px, where its container query matches, and at 200px, where it does not.
-->
<html>
<head>
<style>
  @font-face { font-family: GpuixTestSquare; src: url(gpuix-test-square.ttf); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; }
  .line { font: 20px/20px GpuixTestSquare; color: #000; container-type: inline-size; }

  /* A: a block that is an inline-block in a wide container. */
  .a-box { display: block; width: 30px; height: 10px; }
  @container (min-width: 250px) { .a-box { display: inline-block; } }

  /* B: a block that is inline in a wide container, and its text joins the paragraph. */
  .b-box { display: block; }
  @container (min-width: 250px) { .b-box { display: inline; } }

  /* C: an inline-block that is a block in a narrow container. */
  .c-box { display: inline-block; width: 30px; height: 10px; }
  @container (max-width: 250px) { .c-box { display: block; } }

  /* D: a block that is an inline-flex in a wide container, with the baseline of its first item. */
  .d-box { display: block; }
  .d-item1 { width: 20px; height: 10px; }
  .d-item2 { width: 20px; height: 15px; }
  @container (min-width: 250px) { .d-box { display: inline-flex; } }

  /* E: an inline span that is a block in a wide container. */
  @container (min-width: 250px) { .e-box { display: block; } }

  /* F: hidden in a narrow container, an inline-block in a wide one, inside a span. */
  .f-box { display: none; width: 30px; height: 10px; }
  @container (min-width: 250px) { .f-box { display: inline-block; } }

  /* G: inline in a narrow container, an inline-block with a width of its own in a wide one, with text in it. */
  .g-box { display: inline; }
  @container (min-width: 250px) { .g-box { display: inline-block; width: 50px; } }
</style>
</head>
<body>

<div class="line" data-case data-id="a-300" style="width: 300px"><span data-id="a-300.t1">A</span><div class="a-box" data-id="a-300.box"></div><span data-id="a-300.t2">A</span></div>
<div class="line" data-case data-id="a-200" style="width: 200px"><span data-id="a-200.t1">A</span><div class="a-box" data-id="a-200.box"></div><span data-id="a-200.t2">A</span></div>

<div class="line" data-case data-id="b-300" style="width: 300px"><span data-id="b-300.t1">A</span><div class="b-box" data-id="b-300.box">AA</div><span data-id="b-300.t2">A</span></div>
<div class="line" data-case data-id="b-200" style="width: 200px"><span data-id="b-200.t1">A</span><div class="b-box" data-id="b-200.box">AA</div><span data-id="b-200.t2">A</span></div>

<div class="line" data-case data-id="c-300" style="width: 300px"><span data-id="c-300.t1">A</span><div class="c-box" data-id="c-300.box"></div><span data-id="c-300.t2">A</span></div>
<div class="line" data-case data-id="c-200" style="width: 200px"><span data-id="c-200.t1">A</span><div class="c-box" data-id="c-200.box"></div><span data-id="c-200.t2">A</span></div>

<div class="line" data-case data-id="d-300" style="width: 300px"><span data-id="d-300.t1">A</span><div class="d-box" data-id="d-300.box"><div class="d-item1" data-id="d-300.item1"></div><div class="d-item2" data-id="d-300.item2"></div></div><span data-id="d-300.t2">A</span></div>
<div class="line" data-case data-id="d-200" style="width: 200px"><span data-id="d-200.t1">A</span><div class="d-box" data-id="d-200.box"><div class="d-item1" data-id="d-200.item1"></div><div class="d-item2" data-id="d-200.item2"></div></div><span data-id="d-200.t2">A</span></div>

<div class="line" data-case data-id="e-300" style="width: 300px"><span data-id="e-300.t1">A</span><span class="e-box" data-id="e-300.box">AA</span><span data-id="e-300.t2">A</span></div>
<div class="line" data-case data-id="e-200" style="width: 200px"><span data-id="e-200.t1">A</span><span class="e-box" data-id="e-200.box">AA</span><span data-id="e-200.t2">A</span></div>

<div class="line" data-case data-id="f-300" style="width: 300px"><span data-id="f-300.span">A<div class="f-box" data-id="f-300.box"></div>A</span></div>
<div class="line" data-case data-id="f-200" style="width: 200px"><span data-id="f-200.span">A<div class="f-box" data-id="f-200.box"></div>A</span></div>

<div class="line" data-case data-id="g-300" style="width: 300px"><span data-id="g-300.t1">A</span><div class="g-box" data-id="g-300.box">A</div><span data-id="g-300.t2">A</span></div>
<div class="line" data-case data-id="g-200" style="width: 200px"><span data-id="g-200.t1">A</span><div class="g-box" data-id="g-200.box">A</div><span data-id="g-200.t2">A</span></div>

<script>
  document.fonts.load('20px GpuixTestSquare').then(() => {
    const rects = {}
    for (const element of document.querySelectorAll('[data-id]')) {
      const origin = (element.closest('[data-case]') ?? element).getBoundingClientRect()
      const { x, y, width, height } = element.getBoundingClientRect()
      rects[element.dataset.id] = [x - origin.x, y - origin.y, width, height]
    }
    document.body.setAttribute('data-rects', JSON.stringify(rects))
  })
</script>
</body>
</html>
