<!doctype html>
<!--
  Oracle for line-fit.test.tsx: where Chrome breaks a text into lines in a box of a given width, at device scale 1 and 2
  (`sh dsf-oracle.sh line-fit` writes line-fit-oracle.json and line-fit-oracle-x2.json).

  A row is a case (a text in a font, with its `word-break` and `overflow-wrap`) and the width of the box it is laid out in,
  and the oracle gives the text of each line, without the spaces that hang at its end. The widths are the ones the old fit
  test (`line width <= box width + 1/1024`) and Blink's disagree on, as Blink's line breaker fits a line: the sum of the
  widths of its pieces (one per text node), each from the start of the line and ceiled to 1/64 of a device pixel, is at most
  the box's width cut to 1/64 of a device pixel and one 1/64 more (`LineBreaker::AvailableWidthToFit`). They are the widths
  at which a line is within a hair of fitting (the width of a line of Chrome's lines, and the 3 units below it), a few
  widths at which the lines of a sweep differ, rows where the old rule and Chrome agreed, `break-all` and soft hyphens (a
  soft hyphen draws a hyphen in Chrome where it breaks and its width counts in the fit), and the fonts: Helvetica and Times
  (kerned through a `kern` table that HarfBuzz splits), Helvetica Neue, Menlo and Inter Variable with the variations of
  Fluid Functionalism's text styles (`inter-text-subset.ttf`: Inter Variable cut to the characters of these texts).
  The rows come from a sweep of 596 texts at both scales (the lines of Chrome 156 against gpuix's, see FORK.md). Rows that
  gpuix still lays out differently are left out: 16 of 338 at scale 1 and 16 of 323 at scale 2 (before round 26 item 1),
  mostly cut words and `break-all`, where Blink shapes the end of a line again between two kerned letters.
  The `d-reshape` cases (round 26, item 1) are that reshape and the minus sign: cut words (`overflow-wrap: anywhere` and
  `break-word`) and `break-all` of kerned capitals and words in Inter, Helvetica and Times (a `kern` table split between
  its glyphs) and Menlo (no kerning), and `-` before a digit at the start of a line. Their rows are taken from a sweep of
  widths from 18 to 230 px per case (8142 rows at each scale): up to 5 where gpuix put a line break elsewhere before the
  reshape and 1 where it never did. The rows of the sweep that gpuix still lays out differently (23 of 8142 at scale 1, 29
  at scale 2: Inter at a box one or two letters wide, where HarfBuzz's safe-to-break boundaries reach past kerned pairs)
  are left out.
  Every edge row of four Inter texts at weight 550 and optical size 18 (`Swap radius`, `This label`, `You like`,
  `Prototyping`; 200 widths at each scale) is in as well: Blink adds up advances that it has cut to a 65536th of a device
  pixel (Skia's `f32`, truncated) and a kern is a whole number of the same, so its sum of a line of 40 to 100 glyphs is a
  few 10^-4 px under the exact one, which decides the lines at these widths (round 26, item 3).
-->
