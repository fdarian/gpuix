  of its second (a negative delay on a paused animation) and the border box is read with `getBoundingClientRect`, the

  them come the transitions of a `var()` transform: `--p` (or the custom properties named) change from one value to

    sh transform-animation-oracle.sh

    (wrap === null ? el : holder).remove();
  }
  out[name] = result;
});
for (const [name, property, value, custom, where, extra = ""] of transitions) {
  const result = { kind: "transition", property, value, custom, where, extra, boxes: {}, matrices: {}, origins: {}, animations: {} };
  for (const time of TRANSITION_TIMES) {
    const outer = document.createElement("div");
    const el = document.createElement("div");
    el.id = "s";
    el.style.cssText = `${extra} ${property}: ${value}; transition: ${property} 1s linear;`;
    if (where === "root") {
      const middle = document.createElement("div");
      outer.appendChild(middle);
      middle.appendChild(el);
    } else {
      outer.appendChild(el);
    }
    scene.appendChild(outer);
    const target = where === "self" ? el : outer;
    const set = (index) => {
      for (const [property, values] of Object.entries(custom)) {
        if (values[index] === null) target.style.removeProperty(property);
        else target.style.setProperty(property, String(values[index]));
      }
    };
    set(0);
    el.getBoundingClientRect();
    set(1);
    const running = el.getAnimations().filter((animation) => animation.transitionProperty === property);
    result.animations[time] = running.length;
    for (const animation of running) {
      animation.pause();
      animation.currentTime = time * 1000;
    }
    const rect = el.getBoundingClientRect();
    result.boxes[time] = [rect.x, rect.y, rect.width, rect.height];
    result.matrices[time] = getComputedStyle(el).transform;
    result.origins[time] = getComputedStyle(el).transformOrigin;
    outer.remove();
  }
  out[name] = result;
}
document.body.setAttribute("data-oracle", JSON.stringify(out));
