<!doctype html>
<meta charset="utf-8">
<title>Gpuix E2E Fixture</title>
<style>
  html, body { margin: 0; padding: 0; background: #20d0d0; font: 14px sans-serif; overflow: hidden; }
  /* The marker row: the page's top edge, read against the GPUI marker beside the webview. */
  #marker { position: absolute; left: 0; top: 0; width: 100%; height: 10px; background: #ff00ff; }
  .block { position: absolute; top: 10px; width: 100px; height: 100px; }
  #red { left: 0; background: #ff0000; }
  #green { left: 100px; background: #00ff00; }
  #blue { left: 200px; background: #0000ff; }
  #yellow { left: 300px; background: #ffff00; }
  #field { position: absolute; left: 10px; top: 120px; width: 200px; height: 30px; box-sizing: border-box; }
  #button { position: absolute; left: 10px; top: 160px; width: 120px; height: 30px; background: #ff8800; border: 0; }
  #link { position: absolute; left: 10px; top: 200px; width: 160px; height: 30px; background: #ffffff; color: #0000ee; }
  /* The second palette, for the webviews that are not the first. */
  html.alt #red { background: #800000; }
  html.alt #green { background: #008000; }
  html.alt #blue { background: #000080; }
  html.alt #yellow { background: #808000; }
  html.alt { background: #d02020; }
</style>
<div id="marker"></div>
<div class="block" id="red"></div>
<div class="block" id="green"></div>
<div class="block" id="blue"></div>
<div class="block" id="yellow"></div>
<input id="field" value="">
<button id="button">count</button>
<a id="link" href="#anchor">link</a>
<script>
  window.counter = 0;
  window.wheels = 0;
  window.addEventListener("wheel", function () { window.wheels += 1; }, { passive: true });
  window.clicks = 0;
  document.addEventListener("click", function () { window.clicks += 1; });
  window.focusLog = [];
  document.getElementById("button").addEventListener("click", function () { window.counter += 1; });
  document.addEventListener("focusin", function (event) { window.focusLog.push("in:" + event.target.id); });
  document.addEventListener("focusout", function (event) { window.focusLog.push("out:" + event.target.id); });
  window.addEventListener("keydown", function (event) { window.focusLog.push("key:" + event.key); });
  if (location.hash.indexOf("alt") !== -1) document.documentElement.className = "alt";
  window.failNow = function () { throw new Error("boom from the page"); };
</script>
