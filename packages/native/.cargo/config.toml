# The debug frames of a style cascade are large, and a test that nests a few elements sits within a
# few percent of the 2 MiB a test thread gets by default. Every field a style gains moves it over.
[env]
RUST_MIN_STACK = { value = "8388608", force = false }

# Shared-memory flags required by gpui_web and its worker dispatcher.
[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C", "link-arg=--shared-memory",
  "-C", "link-arg=--max-memory=1073741824",
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--export=__wasm_init_tls",
  "-C", "link-arg=--export=__tls_size",
  "-C", "link-arg=--export=__tls_align",
  "-C", "link-arg=--export=__tls_base",
]

[unstable]
build-std = ["std,panic_abort"]
